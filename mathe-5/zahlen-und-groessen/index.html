<script src="../../gemeinsam/runde.js"></script>
<script>
const BRAND='Mathe-Inseln',MISSED='Diese Aufgaben üben wir weiter';
const TOPICS=[
 {id:'diagramm',name:'Diagramm-Insel',map:'Diagramme',sub:'Säulen, Balken, Strichlisten',can:'Säulen- und Balkendiagramme lesen, Strichlisten auswerten'},
 {id:'strahl',name:'Zahlenstrahl-Insel',map:'Zahlenstrahl',sub:'Zahlen ordnen und ablesen',can:'Zahlen ordnen und am Zahlenstrahl ablesen'},
 {id:'gross',name:'Riesenzahl-Insel',map:'Große Zahlen',sub:'Millionen lesen, schreiben, runden',can:'Große Zahlen in Worten verstehen und runden'},
 {id:'fach',name:'Fachwort-Insel',map:'Fachwörter',sub:'Summe, Differenz, Produkt, Quotient',can:'Rechnungen mit Fachwörtern lösen'},
 {id:'klecks',name:'Klecks-Insel',map:'Kleckse',sub:'18 + ● = 31 und Zahlenmauern',can:'Klecksaufgaben mit der Umkehraufgabe lösen'},
 {id:'geld',name:'Geld-Insel',map:'Geld',sub:'Euro und Cent, Wechselgeld',can:'Mit Geld rechnen'},
 {id:'laenge',name:'Längen-Insel',map:'Längen',sub:'mm, cm, dm, m, km',can:'Längen umwandeln und mit Längen rechnen'}
];
const MAP=[[50,42],[130,42],[210,42],[290,42],[250,118],[170,118],[90,118]]; // Seekarte, Reihenfolge wie TOPICS

/* ---------- Hilfen ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));                 // ganze Zufallszahl von a bis b
const fmt=n=>n>=10000?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' '):String(n); // 3989, aber 10 000 (schmales Leerzeichen)
const euro=c=>`${Math.floor(c/100)},${String(c%100).padStart(2,'0')} €`;
const BLOB='<span class="blob" aria-label="Klecks">●</span>';
const mc=(o)=>Object.assign({kind:'mc'},o);
const uniq=a=>[...new Set(a)];
function opts4(correct,cands){return shuffle([correct].concat(shuffle(uniq(cands).filter(x=>x!==correct)).slice(0,3)))}

/* ---------- Zahlwörter ---------- */
const ONES=['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
function w999(n){const h=Math.floor(n/100),r=n%100;let s=h?ONES[h]+'hundert':'';if(r)s+=r<20?ONES[r]:(r%10?ONES[r%10]+'und':'')+TENS[Math.floor(r/10)];return s}
function words(n){ // 1079252849 -> "eine Milliarde neunundsiebzig Millionen zweihundertzweiundfünfzigtausendachthundertneunundvierzig"
  if(!n)return 'null';
  const bi=Math.floor(n/1e9),mi=Math.floor(n/1e6)%1000,th=Math.floor(n/1e3)%1000,re=n%1000,p=[];
  if(bi)p.push(bi===1?'eine Milliarde':w999(bi)+' Milliarden');
  if(mi)p.push(mi===1?'eine Million':w999(mi)+' Millionen');
  const low=(th?w999(th)+'tausend':'')+(re?w999(re)+(re%100===1?'s':''):'');
  if(low)p.push(low);
  return p.join(' ');
}
function bigNum(){ // Millionen bis Hundertmilliarden, Dreiergruppen zum Teil null
  for(;;){const groups=R(3,4),g=[R(1,999)];
  for(let i=1;i<groups;i++)g.push(Math.random()<.25?0:R(1,999));
  const n=g.reduce((a,x)=>a*1000+x,0);
  if(![Math.floor(n/1e9),Math.floor(n/1e6)%1000].some(x=>x>1&&x%100===1))return n} // nicht „hundertein(e) Millionen“: Schreibweise schwankt
}
const PLACES=[['Einer',1],['Zehner',10],['Hunderter',100],['Tausender',1e3],['Zehntausender',1e4],['Hunderttausender',1e5],['Millionen',1e6],['Zehnmillionen',1e7],['Hundertmillionen',1e8],['Milliarden',1e9]];

/* ---------- Grafiken ---------- */
function chartSvg(d,opt={}){ // Säulen- oder Balkendiagramm; Werte liegen immer auf einer Gitterlinie
  const W=opt.w||320,H=opt.h||200,n=d.vals.length,top=d.max,horiz=d.horiz&&!opt.mini;
  const lines=top/d.step,lab=horiz?Math.ceil(lines/6):lines>12?2:1,fs=opt.mini?9:11; // liegend ist weniger Platz für Zahlen
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.t)}" data-max="${top}">`;
  if(!horiz){
    const x0=opt.mini?24:40,y0=H-(opt.mini?16:28),y1=12,pw=W-x0-8,ph=y0-y1,bw=pw/n;
    for(let k=0;k<=lines;k++){const y=y0-ph*k/lines;s+=`<line class="grid" x1="${x0}" x2="${W-8}" y1="${y}" y2="${y}"/>`;if(k%lab===0)s+=`<text x="${x0-4}" y="${y+3.5}" text-anchor="end" font-size="${fs}">${fmt(k*d.step)}</text>`}
    d.vals.forEach((v,i)=>{const h=ph*v/top,x=x0+bw*i+bw*.18;s+=`<rect class="bar" x="${x}" y="${y0-h}" width="${bw*.64}" height="${h}" data-v="${v}" data-p="${ph}"/>`;if(!opt.mini)s+=`<text x="${x0+bw*i+bw/2}" y="${y0+14}" text-anchor="middle" font-size="${fs}">${esc(d.short[i])}</text>`;else s+=`<text x="${x0+bw*i+bw/2}" y="${y0+11}" text-anchor="middle" font-size="8">${esc(d.short[i])}</text>`});
  }else{
    const x0=74,x1=W-12,y0=10,y1=H-24,pw=x1-x0,bh=(y1-y0)/n;
    for(let k=0;k<=lines;k++){const x=x0+pw*k/lines;s+=`<line class="grid" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}"/>`;if(k%lab===0)s+=`<text x="${x}" y="${y1+14}" text-anchor="middle" font-size="${fs}">${fmt(k*d.step)}</text>`}
    d.vals.forEach((v,i)=>{const w=pw*v/top,y=y0+bh*i+bh*.2;s+=`<rect class="bar" x="${x0}" y="${y}" width="${w}" height="${bh*.6}" data-v="${v}" data-p="${pw}"/><text x="${x0-6}" y="${y+bh*.3+4}" text-anchor="end" font-size="${fs}">${esc(d.short[i])}</text>`});
  }
  return s+'</svg>';
}
function tallySvg(n){ // Strichliste: Fünferbündel mit Querstrich
  let s=`<svg class="tally" viewBox="0 0 ${Math.ceil(n/5)*30+4} 26" height="26" role="img" aria-label="Strichliste">`;
  for(let i=0;i<n;i++){const g=Math.floor(i/5),k=i%5,x=4+g*30+k*5;s+=k<4?`<line x1="${x}" y1="3" x2="${x}" y2="23"/>`:`<line x1="${x-19}" y1="20" x2="${x+1}" y2="6"/>`}
  return s+'</svg>';
}
function strahlSvg(start,step,i){ // Zahlenstrahl mit 20 Teilstrichen, beschriftet bei 0, 10 und 20, Pfeil bei Teilstrich i
  const X=k=>30+k*13;let s=`<svg class="strahl" viewBox="0 0 320 74" role="img" aria-label="Zahlenstrahl"><line class="axis" x1="22" x2="298" y1="44" y2="44"/>`; // Rand, damit lange Zahlen nicht abgeschnitten werden
  for(let k=0;k<=20;k++){const h=k%10===0?9:k%5===0?6:4;s+=`<line class="axis" x1="${X(k)}" x2="${X(k)}" y1="${44-h}" y2="${44+h}"/>`;if(k%10===0)s+=`<text x="${X(k)}" y="68" text-anchor="middle" font-size="12">${fmt(start+k*step)}</text>`}
  return s+`<path class="arrow" d="M${X(i)} 31 l-6 -12 h12 z"/><line class="arrowline" x1="${X(i)}" x2="${X(i)}" y1="4" y2="22"/></svg>`;
}
function mauerHtml(rows,hide,cap){ // Zahlenmauer: rows = [[oben],[mitte,mitte],[unten,unten,unten]]
  return `<div class="mauer" aria-label="${esc(cap)}">${rows.map((r,ri)=>`<div class="mrow">${r.map((v,ci)=>`<span class="brick${ri===hide[0]&&ci===hide[1]?' q':''}">${ri===hide[0]&&ci===hide[1]?'?':fmt(v)}</span>`).join('')}</div>`).join('')}</div><p class="tip" style="margin:6px 0 0">${esc(cap)}</p>`;
}

/* ---------- Diagramm-Insel ---------- */
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'],DS=['Mo','Di','Mi','Do','Fr'];
const CHARTS=[
 {t:'Schulweg der Klasse 5b',unit:'Kinder',step:1,max:12,cats:['zu Fuß','mit dem Fahrrad','mit dem Bus','mit dem Auto','mit dem Roller'],short:['zu Fuß','Fahrrad','Bus','Auto','Roller'],ask:c=>`Wie viele Kinder kommen ${c} zur Schule?`},
 {t:'Lieblingstiere der Klasse 5a',unit:'Kinder',step:1,max:10,cats:['Hund','Katze','Pferd','Hase','Hamster'],short:['Hund','Katze','Pferd','Hase','Hamster'],ask:c=>`Wie viele Kinder haben „${c}“ als Lieblingstier?`},
 {t:'Verkaufte Brötchen am Schulkiosk',unit:'Brötchen',step:5,max:60,cats:DAYS,short:DS,ask:c=>`Wie viele Brötchen wurden am ${c} verkauft?`},
 {t:'Besucher im Freibad',unit:'Besucher',step:50,max:600,cats:DAYS,short:DS,ask:c=>`Wie viele Besucher kamen am ${c}?`},
 {t:'Gesammelte Pfandflaschen',unit:'Flaschen',step:10,max:120,cats:['Klasse 5a','Klasse 5b','Klasse 5c','Klasse 5d'],short:['5a','5b','5c','5d'],ask:c=>`Wie viele Flaschen hat die ${c} gesammelt?`}
];
function chartData(n){ // unterschiedliche Werte, damit größter und kleinster eindeutig sind
  const c=pick(CHARTS),k=Math.min(n||c.cats.length,c.cats.length),idx=shuffle([...c.cats.keys()]).slice(0,k).sort((a,b)=>a-b);
  const pool=shuffle([...Array(c.max/c.step).keys()].map(i=>(i+1)*c.step)).slice(0,k);
  return Object.assign({},c,{cats:idx.map(i=>c.cats[i]),short:idx.map(i=>c.short[i]),vals:pool,horiz:Math.random()<.4});
}
const chartBox=d=>`<p class="ctitle">${esc(d.t)}</p>${chartSvg(d)}`;
const D={
 ablesen(){const d=chartData(),i=R(0,d.vals.length-1);return {kind:'num',label:'Lies im Diagramm ab',html:chartBox(d)+`<p>${esc(d.ask(d.cats[i]))}</p>`,ans:d.vals[i],unit:d.unit,sol:`${fmt(d.vals[i])} ${d.unit}`}},
 extrem(){const d=chartData(),max=Math.random()<.5,v=max?Math.max(...d.vals):Math.min(...d.vals),i=d.vals.indexOf(v);
  return mc({label:'Lies im Diagramm ab',html:chartBox(d)+`<p>Wo ist der Wert am ${max?'größten':'kleinsten'}?</p>`,options:shuffle(d.short.slice()),correct:d.short[i],sol:`${d.short[i]} (${fmt(v)} ${d.unit})`})},
 unterschied(){const d=chartData(),[i,j]=shuffle([...d.vals.keys()]).slice(0,2).sort((a,b)=>d.vals[b]-d.vals[a]);
  return {kind:'num',label:'Vergleiche im Diagramm',html:chartBox(d)+`<p>Wie viel mehr sind es bei „${esc(d.short[i])}“ als bei „${esc(d.short[j])}“?</p>`,ans:d.vals[i]-d.vals[j],unit:d.unit,sol:`${fmt(d.vals[i])} − ${fmt(d.vals[j])} = ${fmt(d.vals[i]-d.vals[j])} ${d.unit}`}},
 summe(){const d=chartData(4),t=d.vals.reduce((a,b)=>a+b,0);
  return {kind:'num',label:'Rechne mit dem Diagramm',html:chartBox(d)+`<p>Wie viele ${d.unit} sind es zusammen?</p>`,ans:t,unit:d.unit,sol:`${d.vals.map(fmt).join(' + ')} = ${fmt(t)} ${d.unit}`}},
 strich(){const c=pick([['Kinder mit Brille',['Klasse 5a','Klasse 5b','Klasse 5c']],['Fahrzeuge an der Ampel',['Autos','Fahrräder','Lkw','Busse']],['Würfelwürfe',['Eins','Zwei','Drei','Sechs']]]),
   v=shuffle([...Array(23).keys()].map(i=>i+3)).slice(0,c[1].length),i=R(0,v.length-1);
  return {kind:'num',label:'Werte die Strichliste aus',html:`<p class="ctitle">${esc(c[0])}</p><table class="strich">${c[1].map((k,j)=>`<tr><td>${esc(k)}</td><td>${tallySvg(v[j])}</td></tr>`).join('')}</table><p>Wie oft wurde „${esc(c[1][i])}“ gezählt?</p>`,
    ans:v[i],sol:`${v[i]} Mal (${Math.floor(v[i]/5)} Fünferbündel und ${v[i]%5} Striche)`}},
 passt(){const d=chartData(4);d.horiz=false;const a=d.vals,sw=a.slice();const[i,j]=shuffle([0,1,2,3]).slice(0,2);[sw[i],sw[j]]=[sw[j],sw[i]];
  const off=a.slice(),k=R(0,3);off[k]=off[k]+(off[k]+d.step<=d.max?d.step:-d.step);
  const mk=v=>chartSvg(Object.assign({},d,{vals:v}),{mini:true,w:160,h:110});
  return mc({label:'Welches Diagramm passt zur Tabelle?',raw:true,html:`<p class="ctitle">${esc(d.t)}</p><table class="vt"><tr>${d.short.map(s=>`<th>${esc(s)}</th>`).join('')}</tr><tr>${a.map(v=>`<td>${fmt(v)}</td>`).join('')}</tr></table>`,
    options:shuffle([mk(a),mk(sw),mk(off)]),correct:mk(a),sol:'Das Diagramm, in dem jede Säule genau so hoch ist wie der Wert in der Tabelle.'})},
 deuten(){const s=pick([['Im Diagramm sieht man auf einen Blick, welcher Wert am größten ist.',1],['In der Tabelle kann man die genauen Zahlen ablesen.',1],['Im Diagramm kann man Werte manchmal nur ungefähr ablesen.',1],['In einer Tabelle sieht man sofort, welcher Wert am kleinsten ist, ohne zu vergleichen.',0],['Ein Diagramm zeigt immer genauere Werte als eine Tabelle.',0],['Bei einem Säulendiagramm ist die längste Säule der kleinste Wert.',0]]);
  return mc({label:'Diagramm oder Tabelle: Stimmt das?',html:`<p>${esc(s[0])}</p>`,options:['Stimmt','Stimmt nicht'],correct:s[1]?'Stimmt':'Stimmt nicht',sol:s[1]?'Stimmt.':'Stimmt nicht.'})}
};

/* ---------- Zahlenstrahl-Insel ---------- */
const STEPS=[1,2,5,10,20,25,50,100,200,250,500];
const strahl0=st=>R(0,Math.floor((10000-20*st)/(10*st)))*10*st; // Anfang so, dass der ganze Strahl bis höchstens 10 000 geht
const Z={
 pfeil(){const st=pick(STEPS),start=strahl0(st),i=pick([...Array(19).keys()].map(k=>k+1).filter(k=>k!==10)),v=start+i*st;
  return {kind:'num',label:'Welche Zahl zeigt der Pfeil?',html:strahlSvg(start,st,i),ans:v,sol:`${fmt(v)} (ein Teilstrich = ${fmt(st)})`}},
 nachbar(){const vor=Math.random()<.5,base=pick([R(1,99)*100,R(1,10)*1000,R(100,9999),R(10,999)*10]),n=vor?base:base-(Math.random()<.75?1:2),v=vor?n-1:n+1;
  return {kind:'num',label:vor?'Vorgänger':'Nachfolger',html:`<p>Wie heißt der ${vor?'Vorgänger':'Nachfolger'} von <b>${fmt(n)}</b>?</p>`,ans:v,sol:`${vor?`${fmt(v)} ist der Vorgänger von ${fmt(n)}`:`${fmt(v)} ist der Nachfolger von ${fmt(n)}`}`}},
 ordnen(){const dg=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,3);let ns=[];

/* ---------- Zum Ziehen und Setzen: Diagramm zeichnen, Zahlenstrahl markieren ---------- */
let WS=null; // Zustand der gerade sichtbaren Zieh-Aufgabe (wird nicht gespeichert)
const svgPt=(svg,ev)=>{const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;return {x:(ev.clientX-r.left)*vb.width/r.width,y:(ev.clientY-r.top)*vb.height/r.height}};
// Geometrie: Wertachse von a0 nach a1, Kategorien von b0 bis b1 (senkrecht: a = y, b = x; waagerecht umgekehrt)
const barGeo=q=>q.horiz?{W:320,H:210,n:q.short.length,horiz:true,a0:78,a1:308,b0:8,b1:186}:{W:320,H:210,n:q.short.length,a0:182,a1:12,b0:40,b1:312};
function barBox(g,q,i,v){const len=(g.a1-g.a0)*v/q.max,cw=(g.b1-g.b0)/g.n,c=g.b0+cw*i+cw*.18;
  return g.horiz?{x:g.a0,y:c,w:len,h:cw*.64}:{x:c,y:g.a0+len,w:cw*.64,h:-len}}
function drawBars(q,vals){ // Diagramm zum Ziehen
  const g=barGeo(q),lines=q.max/q.step,lab=g.horiz?Math.ceil(lines/6):lines>12?2:1;
  let s=`<svg class="chart drawsvg" viewBox="0 0 ${g.W} ${g.H}" role="group" aria-label="${esc(q.t)}">`;
  for(let k=0;k<=lines;k++){const p=g.a0+(g.a1-g.a0)*k/lines;
    s+=g.horiz?`<line class="grid" x1="${p}" x2="${p}" y1="${g.b0}" y2="${g.b1}"/>`+(k%lab?'':`<text x="${p}" y="${g.b1+14}" text-anchor="middle" font-size="11">${fmt(k*q.step)}</text>`)
      :`<line class="grid" x1="${g.b0}" x2="${g.b1}" y1="${p}" y2="${p}"/>`+(k%lab?'':`<text x="${g.b0-4}" y="${p+3.5}" text-anchor="end" font-size="11">${fmt(k*q.step)}</text>`)}
  q.short.forEach((c,i)=>{const cw=(g.b1-g.b0)/g.n,mid=g.b0+cw*i+cw/2,b=barBox(g,q,i,vals[i]);
    s+=g.horiz?`<text x="${g.a0-6}" y="${mid+4}" text-anchor="end" font-size="11">${esc(c)}</text>`:`<text x="${mid}" y="${g.a0+14}" text-anchor="middle" font-size="11">${esc(c)}</text>`;
    s+=`<g class="dbar" data-i="${i}" tabindex="0" role="slider" aria-label="${esc(q.cats[i])}" aria-valuemin="0" aria-valuemax="${q.max}" aria-valuenow="0"><rect class="bar"/><rect class="knob"/></g>`});
  return s+'</svg>';
}
const SX=k=>30+k*13; // Teilstrich k auf dem Zahlenstrahl (wie strahlSvg)
const arrowAt=(k,cls)=>`<g class="mark ${cls}" transform="translate(${SX(k)} 0)"><path d="M0 31 l-6 -12 h12 z"/><line x1="0" x2="0" y1="4" y2="22"/></g>`;
function markSvg(q){ // Zahlenstrahl ohne Pfeil, der Pfeil wird gesetzt
  let s=`<svg class="strahl marksvg" viewBox="0 0 320 74" tabindex="0" role="slider" aria-label="Zahlenstrahl: Pfeil setzen" aria-valuemin="0" aria-valuemax="20"><line class="axis" x1="22" x2="298" y1="44" y2="44"/>`;
  for(let t=0;t<=20;t++){const h=t%10===0?9:t%5===0?6:4;s+=`<line class="axis" x1="${SX(t)}" x2="${SX(t)}" y1="${44-h}" y2="${44+h}"/>`;if(t%10===0)s+=`<text x="${SX(t)}" y="68" text-anchor="middle" font-size="12">${fmt(q.start+t*q.step)}</text>`}
  s+=`<rect class="hit" x="0" y="0" width="320" height="74"/><g class="mark live" style="display:none"><path d="M0 31 l-6 -12 h12 z"/><line x1="0" x2="0" y1="4" y2="22"/></g>`;
  return s+'</svg>';
}
const WIDGETS={
 bars:{
  html:q=>`<p class="tip" style="margin:0 0 6px">Zieh ${q.horiz?'die Balken auf die richtige Länge':'die Säulen auf die richtige Höhe'}. Mit der Tastatur: ${q.horiz?'Balken':'Säule'} auswählen, dann Pfeiltasten.</p>${drawBars(q,q.vals.map(()=>0))}`,
  init(q){
    const svg=$('.drawsvg'),g=barGeo(q);WS={v:q.vals.map(()=>0),moved:false,svg,g};
    const set=(i,v)=>{v=Math.max(0,Math.min(q.max,Math.round(v/q.step)*q.step));WS.v[i]=v;
      const el=svg.querySelector(`.dbar[data-i="${i}"]`),b=barBox(g,q,i,v),r=el.querySelector('.bar'),k=el.querySelector('.knob');
      [['x',b.x],['y',b.y],['width',b.w],['height',b.h]].forEach(([a,x])=>r.setAttribute(a,x));
      // Griff liegt innerhalb der Säule, damit die Oberkante genau den Wert zeigt (bei 0 direkt auf der Achse)
      const kn=g.horiz?{x:v?b.x+b.w-6:g.a0,y:b.y,width:6,height:b.h}:{x:b.x,y:v?b.y:g.a0-6,width:b.w,height:6};for(const a in kn)k.setAttribute(a,kn[a]);
      el.setAttribute('aria-valuenow',v)};
    WS.set=(i,v)=>{set(i,v);WS.moved=true};q.vals.forEach((_,i)=>set(i,0));
    const at=ev=>{const p=svgPt(svg,ev),cw=(g.b1-g.b0)/g.n;return {i:Math.floor(((g.horiz?p.y:p.x)-g.b0)/cw),val:((g.horiz?p.x:p.y)-g.a0)/(g.a1-g.a0)*q.max}};
    let drag=null;
    svg.onpointerdown=ev=>{if(G.answered)return;const a=at(ev);if(a.i<0||a.i>=g.n)return;drag=a.i;try{svg.setPointerCapture(ev.pointerId)}catch(e){}WS.set(a.i,a.val);ev.preventDefault()};
    svg.onpointermove=ev=>{if(drag!==null&&!G.answered)WS.set(drag,at(ev).val)};
    svg.onpointerup=svg.onpointercancel=()=>{drag=null};
    svg.querySelectorAll('.dbar').forEach(el=>el.onkeydown=ev=>{if(G.answered)return;const d={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1}[ev.key];
      if(d){ev.preventDefault();ev.stopPropagation();const i=+el.dataset.i;WS.set(i,WS.v[i]+d*q.step)}});
  },
  empty:()=>WS.moved?'':'Zieh zuerst die Säulen auf die richtige Höhe.',
  check:q=>WS.v.every((v,i)=>v===q.vals[i]),
  done(q){WS.svg.classList.add('locked');WS.svg.querySelectorAll('.dbar').forEach(el=>{const i=+el.dataset.i,good=WS.v[i]===q.vals[i];el.classList.add(good?'good':'bad');
    if(!good){const b=barBox(WS.g,q,i,q.vals[i]);el.insertAdjacentHTML('beforeend',`<rect class="target" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`)}})} 
 },
 strahl:{
  html:q=>`<p class="tip" style="margin:0 0 6px">Tippe auf den richtigen Teilstrich oder zieh den Pfeil dorthin. Mit der Tastatur: Zahlenstrahl auswählen, dann Pfeiltasten.</p>${markSvg(q)}`,
  init(q){
    const svg=$('.marksvg');WS={k:null,svg};
    const put=k=>{k=Math.max(0,Math.min(20,k));WS.k=k;const m=svg.querySelector('.mark.live');m.setAttribute('transform',`translate(${SX(k)} 0)`);m.style.display='';
      svg.setAttribute('aria-valuenow',k);svg.setAttribute('aria-valuetext',fmt(q.start+k*q.step))};
    WS.put=put;let drag=false;const at=ev=>Math.round((svgPt(svg,ev).x-30)/13);
    svg.onpointerdown=ev=>{if(G.answered)return;drag=true;try{svg.setPointerCapture(ev.pointerId)}catch(e){}put(at(ev));ev.preventDefault()};
    svg.onpointermove=ev=>{if(drag&&!G.answered)put(at(ev))};svg.onpointerup=svg.onpointercancel=()=>{drag=false};
    svg.onkeydown=ev=>{if(G.answered)return;const d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[ev.key];if(d){ev.preventDefault();ev.stopPropagation();put(WS.k===null?(d>0?0:20):WS.k+d)}};
  },
  empty:()=>WS.k===null?'Setze zuerst den Pfeil auf den Zahlenstrahl.':'',
  check:q=>WS.k===q.i,
  done(q,ok){WS.svg.querySelector('.mark.live').classList.add(ok?'good':'bad');if(!ok)WS.svg.insertAdjacentHTML('beforeend',arrowAt(q.i,'right'))} 
 }
};
D.zeichnen=function(){ // Säulen/Balken zu einer Tabelle oder Strichliste selbst zeichnen
  const tally=Math.random()<.4;let d;do d=chartData(4);while(tally&&d.step!==1);
  const src=tally?`<table class="strich">${d.short.map((k,j)=>`<tr><td>${esc(k)}</td><td>${tallySvg(d.vals[j])}</td></tr>`).join('')}</table>`
    :`<table class="vt"><tr>${d.short.map(s=>`<th>${esc(s)}</th>`).join('')}</tr><tr>${d.vals.map(v=>`<td>${fmt(v)}</td>`).join('')}</tr></table>`;
  return {kind:'widget',w:'bars',label:d.horiz?'Zeichne das Balkendiagramm':'Zeichne das Säulendiagramm',html:`<p class="ctitle">${esc(d.t)}</p>${src}<p>Zeichne ${tally?'zur Strichliste':'zur Tabelle'} ${d.horiz?'die Balken':'die Säulen'} ein.</p>`,
    t:d.t,cats:d.cats,short:d.short,step:d.step,max:d.max,horiz:d.horiz,vals:d.vals,sol:d.short.map((s,i)=>`${s}: ${fmt(d.vals[i])}`).join(', ')};
};
Z.markieren=function(){ // Zahl (oder Mitte zwischen zwei Zahlen) selbst auf dem Zahlenstrahl markieren
  const st=pick(STEPS),start=strahl0(st);let i=pick([...Array(19).keys()].map(k=>k+1).filter(k=>k!==10)),text;
  if(Math.random()<.3){const dd=R(1,Math.min(i,20-i)),a=i-dd,b=i+dd;text=`Markiere die Zahl, die genau in der Mitte zwischen <b>${fmt(start+a*st)}</b> und <b>${fmt(start+b*st)}</b> liegt.`}
  else text=`Markiere die Zahl <b>${fmt(start+i*st)}</b>.`;
  const v=start+i*st,ref=i<10?0:10;
  return {kind:'widget',w:'strahl',label:'Markiere auf dem Zahlenstrahl',html:`<p>${text}</p>`,start,step:st,i,sol:`${fmt(v)}: ${i-ref} Teilstriche nach ${fmt(start+ref*st)} (ein Teilstrich = ${fmt(st)})`};
};

/* ---------- Auswahl der Fragen ---------- */
const SUB={diagramm:D,strahl:Z,gross:G_,fach:F,klecks:K,geld:M_,laenge:L_};
function gen(isl,sub){ // eine Frage einer Insel; Unterart gewichtet nach Fehlern (wk = "insel.unterart")
  const subs=Object.keys(SUB[isl]);
  if(!sub){const w=subs.map(k=>1+Math.min(3,save.weak[isl+'.'+k]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0);sub=subs.find((k,i)=>(r-=w[i])<0)||subs[0]}
  return Object.assign(SUB[isl][sub](),{isl,sub,wk:isl+'.'+sub});
}
const makeQ=topic=>gen(topic==='mix'?pick(TOPICS).id:topic);
const redoQ=q=>gen(q.isl,q.sub);                                     // nach einem Fehler: neue Aufgabe derselben Art
function makeRound(topic){ // Ich-kann-Check: aus jedem Thema zwei verschiedene Aufgaben, wie in einer Klassenarbeit
  if(topic!=='check')return null;
  return TOPICS.flatMap(t=>shuffle(Object.keys(SUB[t.id])).slice(0,2).map(s=>gen(t.id,s)));
}
function mcify(q){ // Zahl-Aufgabe in eine Auswahlfrage verwandeln (für die Blitzrunde)
  if(q.kind==='mc')return q;
  const a=q.ans,show=q.kind==='money'?euro:(n=>fmt(n)+(q.unit?' '+q.unit:''));
  const c=[a+1,a-1,a+10,a-10,a*10,a%10===0?a/10:a+100,a+100,a-100].filter(x=>x>0&&x!==a);
  return Object.assign({},q,{kind:'mc',options:opts4(show(a),c.map(show)),correct:show(a)});
}
function quickQ(){let q;do q=makeQ('mix');while(q.kind==='build'||q.kind==='widget'||q.raw||(q.kind==='num'&&q.ans>99999));return mcify(q)}
function finishExtra(g){ // Ich-kann-Check: Ergebnis je Thema wie in der Liste im Buch
  if(g.topic!=='check')return '';
  const face=k=>k===2?['😀','Kann ich']:k===1?['😐','Fast']:['🙁','Üben'];
  return `<table class="cancheck"><tr><th>Ich kann …</th><th></th><th></th></tr>${TOPICS.map(t=>{const r=(g.res||[]).filter(x=>x.isl===t.id),k=r.filter(x=>x.ok).length,[f,w]=face(k);
    return `<tr><td>${esc(t.can)}</td><td class="face" aria-label="${w}">${f}</td><td>${k<2?`<button class="theme" data-go="${t.id}">Üben</button>`:''}</td></tr>`}).join('')}</table>`;
}
function memory(){ // Paare: Euro und Cent, Längen, Fachwörter, große Zahlen
  const c=[],used=new Set(),add=(a,b)=>{if(used.has(a)||used.has(b))return;c.push({a,b});used.add(a);used.add(b)};
  for(let i=0;i<2;i++){const x=R(101,999);add(euro(x),`${x} ct`)}
  const L=shuffle([()=>{const v=R(2,9);return [`${v} km`,`${fmt(v*1000)} m`]},()=>{const v=R(2,9);return [`${v} m`,`${v*100} cm`]},()=>{const v=R(2,30);return [`${v} cm`,`${v*10} mm`]},()=>{const v=R(2,9);return [`${v} m`,`${v*10} dm`]}]);
  add(...L[0]());add(...L[1]());
  const w=pick(Object.values(OPS));add(w.r,`Ergebnis der ${w.verb}`);
  const b=pick([['eine Million','1 000 000'],['eine Milliarde','1 000 000 000'],['zehntausend','10 000'],['hunderttausend','100 000']]);add(b[0],b[1]);
  while(c.length<PAIRS){const x=R(101,999);add(euro(x),`${x} ct`)}
  memoryGame(shuffle(c),memory,'Finde die Paare, die gleich viel bedeuten: 3,67 € und 367 ct, 2 km und 2000 m …');
}

/* ---------- Speicher (nur Komfort, darf ausfallen) ---------- */
let save={name:'',xp:0,best:{},weak:{},sound:false,blitz:0,memo:0};
try{const s=localStorage.getItem('ma5-v1');if(s)save=Object.assign(save,JSON.parse(s));
  else{const v=JSON.parse(localStorage.getItem('en5-v1')||'null');if(v&&v.name)save.name=v.name} // Name von den Vokabel-Inseln übernehmen
}catch(e){}
save.sound=false; // Mathe liest nichts vor
initRank();
let storageOK=true;
function persist(){try{localStorage.setItem('ma5-v1',JSON.stringify(save));storageOK=true}catch(e){storageOK=false}}
try{localStorage.setItem('ma5-test','1');localStorage.removeItem('ma5-test')}catch(e){storageOK=false}

/* ---------- Startseite ---------- */
const NAMES={check:'Ich-kann-Check',mix:'Große Rundfahrt'};
function home(){
  G=null;M=null;if(B){clearTimeout(B.timer);B=null}
  const hi=save.name?`Ahoi ${esc(save.name)}!`:'Ahoi!';
  const tiles=TOPICS.map(t=>`<button class="tile" data-t="${t.id}"><h3>${t.name}</h3><span class="sub">${t.sub}</span>${starsHtml(save.best[t.id]||0)}</button>`).join('');
  const chests=TOPICS.filter(t=>(save.best[t.id]||0)>=3).length;
  const rg=save.round&&save.round.queue&&save.round.queue.length?save.round:null;
  const resume=rg?`<div class="grid" style="margin-bottom:12px"><button class="tile resume" id="rs"><h3>Weiterspielen</h3><span class="sub">${esc(NAMES[rg.topic]||(TOPICS.find(t=>t.id===rg.topic)||{}).name)}, Frage ${Math.min(rg.done+1,rg.total)} von ${rg.total}</span></button></div>`:'';
  $('#app').innerHTML=`
  <div class="top"><a class="back" href="../../" style="text-decoration:none">Übersicht</a><span class="brand">${BRAND}</span>${themeBtn()}</div>
  <section class="hero"><h1>${hi} Fit für die Mathe-Arbeit?</h1>
   <p>Zahlen und Größen: Diagramme, Zahlenstrahl, große Zahlen, Fachwörter, Klecksaufgaben, Geld und Längen. Jede Insel ist ein Thema, eine Fahrt hat ${ROUND} Aufgaben.</p>
   <div class="rank"><span class="pill sun">${save.xp} Punkte</span><span class="pill">Rang: ${rank()}</span></div>${rankBar()}${hero}</section>
  <div class="namebox"><label for="nm">Dein Name</label><input type="text" id="nm" maxlength="16" value="${esc(save.name)}" placeholder="z. B. Mia" autocomplete="off"></div>
  ${resume}
  <div class="grid"><button class="tile mix" data-t="check"><h3>Ich-kann-Check</h3><span class="sub">Probe-Arbeit: zwei Aufgaben zu jedem Thema. Am Ende siehst du, was du schon kannst.</span>${starsHtml(save.best.check||0)}</button></div>
  <div class="maphead"><h2 class="sec" style="margin:0">Seekarte</h2><span class="pill">Schätze: ${chests} von ${TOPICS.length}</span></div>
  ${seaMap(MAP,170)}
  <p class="tip" style="margin-top:4px">Drei Sterne auf einer Insel, und du findest ihren Schatz.</p>
  <h2 class="sec">Spiele</h2><div class="grid">
   <button class="tile" data-t="mix"><h3>Große Rundfahrt</h3><span class="sub">Aufgaben von allen Inseln gemischt</span>${starsHtml(save.best.mix||0)}</button>
   <button class="tile" id="gb"><h3>Blitzrunde</h3><span class="sub">${BLITZ} Sekunden: Wie viele schaffst du?</span><span class="sub">Rekord: ${save.blitz||0} richtig</span></button>
   <button class="tile" id="gm"><h3>Memory</h3><span class="sub">Finde ${PAIRS} Paare, die gleich viel bedeuten</span><span class="sub">${save.memo?'Rekord: '+save.memo+' Züge':'Noch kein Rekord'}</span></button>
  </div>
  <h2 class="sec">Inseln</h2><div class="grid">${tiles}</div>
  <p class="tip">${storageOK?'Dein Fortschritt wird automatisch auf diesem Gerät gespeichert.':'Speichern geht in diesem Browser gerade nicht (privates Fenster?). Dein Fortschritt geht beim Schließen verloren.'}</p>
  <p class="tip">Sterne gibt es für richtige Antworten beim ersten Versuch: 5 von 10 = 1 Stern, 7 von 10 = 2 Sterne, 9 von 10 = 3 Sterne. Zahlen darfst du mit oder ohne Leerzeichen eingeben, Geldbeträge mit Komma.</p>
  <p class="tip"><button class="theme" id="rst">Alles zurücksetzen</button></p>`;
  bindTheme();
  $('#nm').oninput=e=>{save.name=e.target.value.trim();persist()};
  document.querySelectorAll('[data-t]').forEach(b=>{b.onclick=()=>start(b.dataset.t);
    if(b.tagName==='g')b.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();start(b.dataset.t)}}});
  $('#gb').onclick=blitz;$('#gm').onclick=memory;
  if(rg)$('#rs').onclick=()=>{G=Object.assign({answered:false,res:[]},rg);show()};
  let armed=false;$('#rst').onclick=ev=>{if(!armed){armed=true;ev.target.textContent='Wirklich alles löschen? Nochmal tippen.';return}save={name:'',xp:0,best:{},weak:{},round:null,sound:false,blitz:0,memo:0};persist();home()};
}

home();
</script>
