<title>Pronomen-Inseln</title>

<body>
<div id="app"></div>
<script src="../wortschatz.js"></script>
<script src="../../gemeinsam/gemeinsam.js"></script>
<script src="../../gemeinsam/runde.js"></script>
<script>
const BRAND='Pronomen-Inseln',MISSED='Diese Sätze üben wir weiter',TYPE_PH='Pronomen';
const W=WORTSCHATZ.W;
const TOPICS=[
 {id:'uebersetzen',name:'Ich-du-er-Insel',map:'ich, du, er',sub:'ich = I, wir = we, er = he …'},
 {id:'zuordnen',name:'Zuordnen-Insel',map:'Zuordnen',sub:'Lisa → she, Tom and I → we'},
 {id:'ersetzen',name:'Ersetz-Insel',map:'Ersetzen',sub:'Aus „Tom“ wird „he“'},
 {id:'luecken',name:'Lücken-Insel',map:'Lücken',sub:'Welches Pronomen fehlt im Satz?'},
 {id:'wer',name:'Wer-ist-das-Insel',map:'Wer ist das?',sub:'Wen meint „she“ im Satz?'},
 {id:'fehler',name:'Fehler-Insel',map:'Fehler',sub:'Stimmt der Satz oder nicht?'},
 {id:'bauen',name:'Satzbau-Insel',map:'Satzbau',sub:'Sätze mit Pronomen bauen'}
];
const MAP=[[50,42],[130,42],[210,42],[290,42],[250,118],[170,118],[90,118]]; // Seekarte, Reihenfolge wie TOPICS

/* ---------- Pronomen und Satzbausteine ---------- */
// Nur Subjektpronomen (wer macht etwas?). Objektformen (me, him, them ...) kommen erst später im Unterricht.
// you steht zweimal: du und ihr. Die Reihenfolge ist fest, n.p zeigt auf diese Liste.
const PR=[{s:'I',de:'ich'},{s:'you',de:'du'},{s:'he',de:'er'},{s:'she',de:'sie (eine Person)'},{s:'it',de:'es'},{s:'we',de:'wir'},{s:'you',de:'ihr (mehrere)'},{s:'they',de:'sie (mehrere)'}];
const FORMS=[...new Set(PR.map(p=>p.s))];
const deOf=w=>PR.filter(p=>p.s===w).map(p=>p.de).join(' / ');
const cap=t=>t[0].toUpperCase()+t.slice(1);

// Personen: eigene Namen und Familienwörter aus der Wortliste. Neue Personen-Wörter hier mit he/she eintragen.
const NAMES={he:['Tom','Ben','Max','Leo'],she:['Lisa','Emma','Mia','Anna']};
const PERSON={boy:'he',girl:'she',mum:'she',mother:'she',dad:'he',father:'he',brother:'he',sister:'she'};
// Dinge und Tiere: alle Nomen der Wortliste (deutsches Wort großgeschrieben), außer Personen, Zeit und Zahlen.
const SKIP=['home','kid','people','colour','hometown'];
const PHYS=['tiere','klasse','stadt','farben','leute']; // zum Ansehen und Anfassen: "is here", "is big"
const isThing=e=>{const en=enShow(e);return /^[A-ZÄÖÜ]/.test(deShow(e))&&/^[a-z][a-z ]*$/.test(en)&&!/ of$/.test(en)
  &&!['zeit','zahlen'].includes(e[0])&&!PERSON[en]&&!SKIP.includes(en)&&!/(\S+) \/ \1in\b/.test(deShow(e))};
const THINGS=W.filter(isThing);
const petLike=n=>!!(n.e&&(n.e[0]==='tiere'||enShow(n.e)==='boat')); // Tiere (und Boote) sind in der Schule "it", im Englischen aber auch he/she möglich

function personNP(){
  const fam=W.filter(e=>PERSON[enShow(e)]);
  if(Math.random()<.55||!fam.length){const g=pick(['he','she']);return {t:pick(NAMES[g]),p:g==='he'?2:3,person:true,name:true}}
  const w=enShow(pick(fam));return {t:(['boy','girl'].includes(w)?'the ':'my ')+w,p:PERSON[w]==='he'?2:3,person:true};
}
const NEW=['klasse','farben']; // "is new" nur bei Schulsachen und Kleidung (nicht "The sea is new")
function thingNP(pool=THINGS){const e=pick(pool);return {t:'the '+enShow(e),p:4,phys:PHYS.includes(e[0]),nw:NEW.includes(e[0]),e}}
function npOf(k){
  if(k==='I')return {t:'I',p:0,who:pick(NAMES[pick(['he','she'])])};        // "My name is Tom. I am ..."
  if(k==='you')return {t:'you',p:1,who:pick(NAMES[pick(['he','she'])])};     // "Hello, Lisa! How old are you?"
  if(k==='it')return thingNP();
  if(k==='person')return personNP();
  if(k==='they-p'){const a=personNP(),fam=t=>t.startsWith('my ')?PERSON[t.slice(3)]:null;let b;do b=personNP();while(b.t===a.t||(fam(a.t)&&fam(a.t)===fam(b.t))); // nicht "my mum and my mother"
   return {t:a.t+' and '+b.t,p:7,person:true,pl:true}}
  if(k==='they-t'){const P=THINGS.filter(x=>PHYS.includes(x[0])&&!['zoo','animal','pet'].includes(enShow(x))),a=thingNP(P.filter(x=>P.filter(y=>y[0]===x[0]).length>1)),b=pick(P.filter(x=>x[0]===a.e[0]&&'the '+enShow(x)!==a.t)); // nicht "the frog and the zoo" // zwei Dinge von derselben Insel
    return {t:a.t+' and the '+enShow(b),p:7,pl:true,phys:true,nw:a.nw,e:a.e}}
  if(k==='we'){const a=personNP();return {t:a.t+' and I',p:5,person:true,pl:true}}
  if(k==='youpl'){const a=personNP();return {t:'you and '+a.t,p:6,person:true,pl:true}}
}
const T={
 I:['{} am ten years old.','{} am at school.','{} am late.','{} am from Germany.','{} am at home.'],
 you:['How old are {}?','Where are {}?','{} are my friend.','{} are late.','{} are nice.'],
 person:['{} is at school.','{} is my friend.','{} is nice.','{} is late.','{} is at home.','{} is sad.','{} is friendly.','Where is {}?'],
 name:['{} is ten years old.','{} is from Germany.'],
 people:['{} are at school.','{} are nice.','{} are late.','{} are at home.','{} are sad.','{} are friendly.','Where are {}?'],
 thing:['{} is great.','{} is nice.'],physThing:['{} is here.','{} is there.','{} is big.','Where is {}?'],newThing:['{} is new.'],
 things:['{} are great.','{} are nice.'],physThings:['{} are here.','{} are there.','{} are big.','Where are {}?'],newThings:['{} are new.']
};
const ALL=['person','person','it','it','they-p','they-t','we','youpl'], NOUNS=ALL; // NOUNS: Satzteile, die man ersetzen kann
// Ein Satz mit Nomen, dazu derselbe Satz mit Pronomen
function sentence(kinds=ALL){
  const n=npOf(pick(kinds));
  const L=n.p===0?T.I:n.p===1?T.you:n.p===4?T.thing.concat(n.phys?T.physThing:[],n.nw?T.newThing:[]):n.person&&n.pl?T.people.filter(t=>(n.p!==5&&n.p!==6)||!t.startsWith('Where'))
    :n.pl?T.things.concat(n.phys?T.physThings:[],n.nw?T.newThings:[]):T.person.concat(n.name?T.name:[]);
  const t=pick(L),at0=t.startsWith('{}'),put=x=>t.replace('{}',at0||x==='I'?cap(x):x),w=PR[n.p].s;
  return {t,at0,put,n,w,orig:put(n.t),mark:t.replace('{}','**'+(at0?cap(n.t):n.t)+'**'),out:put(w)};
}
const shown=(s,x)=>s.at0||x==='I'?cap(x):x;                       // so steht das Pronomen im Satz
// avoid: Pronomen, die man auch begründen könnte. Bei Tieren nie he/she (Haustiere!), mit ctx bei einer Person nie it ("It is late." = Es ist spät).
const avoidFor=(s,ctx)=>(petLike(s.n)?['he','she']:[]).concat(ctx&&s.n.person&&!s.n.pl?['it']:[]);
const choices=(s,ctx)=>{const av=avoidFor(s,ctx);return shuffle([s.w].concat(shuffle(FORMS.filter(x=>x!==s.w&&!av.includes(x))).slice(0,3))).map(x=>shown(s,x))};
// Erster Satz, der das fette Wort einführt (danach nie "Where ...?", das passte nicht zu "This is Lisa.")
const intro=n=>n.p===0?`My name is **${n.who}**.`:n.p===1?`Hello, **${n.who}**!`:n.person&&n.pl?`**${cap(n.t)}** are friends.`
  :n.person?`This is **${n.t}**.`:`Look at **${n.t}**!`;
const ctxSentence=kinds=>{let s;do s=sentence(kinds);while(s.t.startsWith('Where'));return s};

/* ---------- Fragen (alle als reine Daten, damit Runden gespeichert werden können) ---------- */
// Felder: kind (mc|type|build|listen), label, prompt (**fett** erlaubt), options/correct, accept, tiles/target, sol, say, wk (Übungs-Schlüssel)
function qTrans(quick){
  if(Math.random()<.55){
    const p=pick(PR),correct=p.s;
    const q={kind:'mc',label:'Wie heißt das auf Englisch?',prompt:p.de,options:shuffle([correct].concat(shuffle(FORMS.filter(w=>w!==correct)).slice(0,3))),correct,accept:[correct],sol:`${p.de} = ${correct}`,say:correct,wk:correct};
    if(!quick&&Math.random()<.4){q.kind='type';q.label='Schreibe das englische Pronomen'}
    return q;
  }
  const w=pick(FORMS),correct=deOf(w);
  return {kind:'mc',label:'Was heißt das auf Deutsch?',prompt:w,options:shuffle([correct].concat(shuffle(FORMS.filter(x=>x!==w).map(deOf)).slice(0,3))),correct,sol:`${w} = ${correct}`,say:w,wk:w};
}
function qSimple(){ // "Lisa → she", "Tom and I → we"
  const s=sentence(NOUNS);
  return {kind:'mc',label:'Welches Pronomen passt?',prompt:`${cap(s.n.t)} → ?`,options:choices(Object.assign({},s,{at0:false})),correct:s.w,sol:`${cap(s.n.t)} → ${s.w}`,say:s.out,wk:s.w};
}
function qReplace(){
  const s=sentence(NOUNS);
  return {kind:'mc',label:'Welches Pronomen ersetzt den fetten Teil?',prompt:s.mark,options:choices(s),correct:shown(s,s.w),sol:s.out,say:s.out,wk:s.w};
}
function qGap(quick){
  const s=ctxSentence(ALL.concat(['I','you'])),correct=shown(s,s.w),i=intro(s.n);
  const q={kind:'mc',label:'Welches Pronomen passt zum fetten Wort?',prompt:`${i} ${s.t.replace('{}','___')}`,options:choices(s,true),correct,accept:[correct],
    sol:`${plain(i)} ${s.out}`,say:`${plain(i)} ${s.out}`,wk:s.w};
  if(!quick&&Math.random()<.5){q.kind='type';q.label='Schreibe das Pronomen für das fette Wort'}
  return q;
}
function qWho(){
  const kinds=['person','person','it','they-p','they-t','we'],s=sentence(kinds),opts=[s.n.t],seen=new Set([s.n.p]);
  for(let i=0;i<40&&opts.length<4;i++){const n=npOf(pick(kinds));if(seen.has(n.p)||(petLike(n)&&['he','she'].includes(s.w)))continue;seen.add(n.p);opts.push(n.t)}
  return {kind:'mc',label:'Wen oder was kann das fette Pronomen meinen?',prompt:s.t.replace('{}','**'+shown(s,s.w)+'**'),options:shuffle(opts),correct:s.n.t,
    sol:`${shown(s,s.w)} = ${s.n.t}`,say:s.out,wk:s.w};
}
function qFehler(){
  const ok=Math.random()<.45,yes=ok?'Stimmt':'Stimmt nicht';
  if(Math.random()<.15){ // I schreibt man immer groß
    const s=ctxSentence(['I']),i=intro(s.n);
    return {kind:'mc',label:'Stimmt der Satz?',prompt:`${i} ${ok?s.out:s.out.replace(/^I /,'i ')}`,options:['Stimmt','Stimmt nicht'],correct:yes,
      sol:(ok?'':'I schreibt man immer groß: ')+`${plain(i)} ${s.out}`,say:`${plain(i)} ${s.out}`,wk:'I'};
  }
  // falsches Pronomen zum Satz davor: "This is Lisa. He is nice." Ohne Tiere, denn Haustiere dürfen im Englischen auch he/she sein.
  let s;do s=ctxSentence(['person','person','it','they-p','they-t','we','you']);while(petLike(s.n));
  const i=intro(s.n),same=s.n.p===1||s.n.pl?['we','they']:s.n.person?['he','she']:['he','she','it']; // gleiche Verbform (is/are); bei Personen kein it ("It is nice." wäre auch richtig)
  const wrong=pick(same.filter(x=>x!==s.w));
  return {kind:'mc',label:'Passt das Pronomen zum fetten Wort?',prompt:`${i} ${ok?s.out:s.put(wrong)}`,options:['Stimmt','Stimmt nicht'],correct:yes,
    sol:(ok?'':'Richtig heißt es: ')+`${plain(i)} ${s.out}`,say:`${plain(i)} ${s.out}`,wk:s.w};
}
function qBuild(){
  let s;do s=sentence(NOUNS);while(/ (here|there)\b/.test(s.t)); // "Here it is." wäre auch richtig
  const t=toks(s.out),o=petLike(s.n)&&!s.n.pl?'they':pick((s.n.pl?['we','they','you']:['he','she','it']).filter(x=>x!==s.w));
  return {kind:'build',label:'Bau den Satz mit Pronomen',prompt:s.mark,tiles:scramble(t.concat([shown(s,o)])),target:t.join(' '),extra:1,sol:s.out,say:s.out,wk:s.w};
}
function qListen(){ // hören und den gehörten Satz wählen: He / She / It is ... oder We / They / You are ...
  const s=sentence(ALL.concat(['you'])),pool=s.n.p===1||s.n.pl?['we','they','you']:['he','she','it'];
  return {kind:'listen',label:'Was hörst du?',options:shuffle(pool.map(x=>s.put(x))),correct:s.out,sol:s.out,say:s.out,wk:s.w};
}
const GEN={
 uebersetzen:()=>qTrans(), zuordnen:qSimple,
 ersetzen:()=>canSpeak()&&Math.random()<.25?qListen():qReplace(),
 luecken:()=>canSpeak()&&Math.random()<.2?qListen():qGap(),
 wer:qWho, fehler:qFehler, bauen:qBuild
};
const quickQ=()=>pick([()=>qTrans(true),qSimple,qReplace,qFehler,()=>qGap(true)])();
function makeQ(topic){ // drei Kandidaten, der mit dem schwächsten Pronomen gewinnt
  const g=topic==='mix'?()=>GEN[pick(TOPICS).id]():GEN[topic];
  const c=[g(),g(),g()];return c.sort((a,b)=>(save.weak[b.wk]||0)-(save.weak[a.wk]||0)+Math.random()-.5)[0];
}
const MEMO=()=>{ // Paare mit eindeutigen Kartentexten: Englisch ↔ Deutsch oder Pronomen ↔ Person
  const c=FORMS.map(w=>({a:w,b:deOf(w)})).concat([...Array(12)].map(()=>{let s;do s=sentence(NOUNS);while(petLike(s.n));return {a:s.w,b:s.n.t}}));
  const out=[],used=new Set();
  for(const x of shuffle(c)){if(used.has(x.a)||used.has(x.b))continue;out.push(x);used.add(x.a);used.add(x.b);if(out.length===PAIRS)break}
  return out;
};

/* ---------- Speicher (nur Komfort, darf ausfallen) ---------- */
let save={name:'',xp:0,best:{},weak:{},sound:true,blitz:0,memo:0};
try{const s=localStorage.getItem('en5-pron-v2');if(s)save=Object.assign(save,JSON.parse(s));
  else{ // v1 enthielt noch Objektpronomen: nur Name, Punkte, Ton und Rekorde übernehmen, sonst den Namen von den Vokabel-Inseln
    const o=JSON.parse(localStorage.getItem('en5-pron-v1')||'null')||{},v=JSON.parse(localStorage.getItem('en5-v1')||'null')||{};
    save.name=o.name||v.name||'';save.xp=o.xp||0;save.blitz=o.blitz||0;save.memo=o.memo||0;if(o.sound===false||v.sound===false)save.sound=false;
  }}catch(e){}
initRank();
let storageOK=true;
function persist(){try{localStorage.setItem('en5-pron-v2',JSON.stringify(save));storageOK=true}catch(e){storageOK=false}}
try{localStorage.setItem('en5-test','1');localStorage.removeItem('en5-test')}catch(e){storageOK=false}

/* ---------- Ansichten ---------- */
const cheat=`<details class="mist"><summary><b>Spickzettel: die Pronomen</b></summary>
 <table class="cheat"><tr><th>Deutsch</th><th>Englisch</th><th>Beispiel</th></tr>
 ${[['ich','I','I am ten.'],['du','you','You are nice.'],['er','he','Tom → he'],['sie (eine Person)','she','Lisa → she'],['es','it','the dog → it'],['wir','we','Tom and I → we'],['ihr (mehrere)','you','you and Tom → you'],['sie (mehrere)','they','Tom and Lisa → they']]
   .map(([d,e,x])=>`<tr><td>${esc(d)}</td><td><b>${e}</b></td><td>${esc(x)}</td></tr>`).join('')}</table>
 <p class="tip">Tiere und Dinge sind <b>it</b>. <b>I</b> schreibt man immer groß. Nach I kommt <b>am</b>, nach he, she, it kommt <b>is</b>, nach we, you, they kommt <b>are</b>.</p></details>`;
function home(){
  G=null;M=null;if(B){clearTimeout(B.timer);B=null}
  const hi=save.name?`Ahoi ${esc(save.name)}!`:'Ahoi!';
  const tiles=TOPICS.map(t=>`<button class="tile" data-t="${t.id}"><h3>${t.name}</h3><span class="sub">${t.sub}</span>${starsHtml(save.best[t.id]||0)}</button>`).join('');
  const chests=TOPICS.filter(t=>(save.best[t.id]||0)>=3).length;
  const rg=save.round&&save.round.queue&&save.round.queue.length?save.round:null;
  const resume=rg?`<div class="grid" style="margin-bottom:12px"><button class="tile resume" id="rs"><h3>Weiterspielen</h3><span class="sub">${esc(rg.topic==='mix'?'Große Rundfahrt':(TOPICS.find(t=>t.id===rg.topic)||{}).name)}, Frage ${Math.min(rg.done+1,rg.total)} von ${rg.total}</span></button></div>`:'';
  $('#app').innerHTML=`
  <div class="top"><a class="back" href="../../" style="text-decoration:none">Übersicht</a><span class="brand">${BRAND}</span>${themeBtn()}</div>
  <section class="hero"><h1>${hi} Wer ist he, wer ist she?</h1>
   <p>Pronomen sind kleine Wörter für Personen und Dinge: I, you, he, she, it, we, they. Jede Insel zeigt sie von einer anderen Seite. Eine Fahrt hat ${ROUND} Fragen.</p>
   <div class="rank"><span class="pill sun">${save.xp} Punkte</span><span class="pill">Rang: ${rank()}</span></div>${rankBar()}${hero}</section>
  <div class="namebox"><label for="nm">Dein Name</label><input type="text" id="nm" maxlength="16" value="${esc(save.name)}" placeholder="z. B. Mia" autocomplete="off"></div>
  ${resume}${cheat}
  <div class="maphead"><h2 class="sec" style="margin:0">Seekarte</h2><span class="pill">Schätze: ${chests} von ${TOPICS.length}</span></div>
  ${seaMap(MAP,170)}
  <p class="tip" style="margin-top:4px">Drei Sterne auf einer Insel, und du findest ihren Schatz.</p>
  <h2 class="sec">Spiele</h2><div class="grid">
   <button class="tile mix" data-t="mix"><h3>Große Rundfahrt</h3><span class="sub">Alle Inseln auf einmal, die schwierigste Fahrt</span>${starsHtml(save.best.mix||0)}</button>
   <button class="tile" id="gb"><h3>Blitzrunde</h3><span class="sub">${BLITZ} Sekunden: Wie viele schaffst du?</span><span class="sub">Rekord: ${save.blitz||0} richtig</span></button>
   <button class="tile" id="gm"><h3>Memory</h3><span class="sub">Finde ${PAIRS} Pronomen-Paare</span><span class="sub">${save.memo?'Rekord: '+save.memo+' Züge':'Noch kein Rekord'}</span></button>
  </div>
  <h2 class="sec">Inseln</h2><div class="grid">${tiles}</div>
  <p class="tip">${storageOK?'Dein Fortschritt wird automatisch auf diesem Gerät gespeichert.':'Speichern geht in diesem Browser gerade nicht (privates Fenster?). Dein Fortschritt geht beim Schließen verloren.'}</p>
  <p class="tip">Sterne gibt es für richtige Antworten beim ersten Versuch: 5 von 10 = 1 Stern, 7 von 10 = 2 Sterne, 9 von 10 = 3 Sterne.</p>
  <p class="tip">${VOICE?`<button class="theme" id="snd">${save.sound?'🔊 Ton an':'🔇 Ton aus'}</button> Hör-Fragen und Vorlesen nutzen die Stimme dieses Geräts.${/Firefox/.test(navigator.userAgent)&&/Macintosh/.test(navigator.userAgent)?' In Firefox auf dem Mac knackt die Stimme am Ende, in Safari oder Chrome klingt sie sauber.':''}${/iPhone/.test(navigator.userAgent)?' Kein Ton auf dem iPhone? Stummschalter ausschalten (Klingeln an) und lauter stellen.':''}`:'Auf diesem Gerät ist keine englische Stimme eingebaut, deshalb gibt es hier keine Hör-Fragen.'}</p>
  <p class="tip"><button class="theme" id="rst">Alles zurücksetzen</button></p>`;
  if(VOICE)$('#snd').onclick=()=>{save.sound=!save.sound;persist();say("Hello! Let's go!");home()};
  bindTheme();
  $('#nm').oninput=e=>{save.name=e.target.value.trim();persist()};
  document.querySelectorAll('[data-t]').forEach(b=>{b.onclick=()=>start(b.dataset.t);
    if(b.tagName==='g')b.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();start(b.dataset.t)}}});
  $('#gb').onclick=blitz;$('#gm').onclick=memory;
  if(rg)$('#rs').onclick=()=>{G=Object.assign({answered:false},rg);show()};
  let armed=false;$('#rst').onclick=ev=>{if(!armed){armed=true;ev.target.textContent='Wirklich alles löschen? Nochmal tippen.';return}save={name:'',xp:0,best:{},weak:{},round:null,sound:save.sound,blitz:0,memo:0};persist();home()};
}

function memory(){memoryGame(MEMO(),memory,'Finde die Paare: wir gehört zu we, Lisa gehört zu she.')}

home();
</script>

</body>
</html>
