<title>Vokabel-Inseln</title>
<style>
/* Layout: eine schmale Spalte, Inseln als Kacheln, eine Frage pro Bildschirm. Thema: Segeltörn von Insel zu Insel. */
:root{
  --bg:#eef6fa; --card:#ffffff; --ink:#10263b; --muted:#53697b; --line:#cfe0ea;
  --sea:#0e6f94; --sea-soft:#d8eef6; --coral:#ff5a4e; --coral-ink:#ffffff; --sun:#ffc93c; --sun-ink:#3a2a00;
  --good:#17895a; --good-soft:#d9f3e6; --bad:#c93a32; --bad-soft:#fde3e0;
  --f-display:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold','Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --f-body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1a28; --card:#12293c; --ink:#eaf3f9; --muted:#9db4c5; --line:#24435c;
  --sea:#4fc0e8; --sea-soft:#133a52; --coral:#ff7468; --coral-ink:#2b0805; --sun:#ffd25a; --sun-ink:#2b2000;
  --good:#4fd196; --good-soft:#12382b; --bad:#ff8a80; --bad-soft:#401c19; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a1a28; --card:#12293c; --ink:#eaf3f9; --muted:#9db4c5; --line:#24435c;
  --sea:#4fc0e8; --sea-soft:#133a52; --coral:#ff7468; --coral-ink:#2b0805; --sun:#ffd25a; --sun-ink:#2b2000;
  --good:#4fd196; --good-soft:#12382b; --bad:#ff8a80; --bad-soft:#401c19; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:20px 48px}
#app{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:600;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:var(--sea);letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink);font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.hero{background:var(--sea);color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:20px;position:relative;overflow:hidden}
:root[data-theme="dark"] .hero{color:#06202e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{color:#06202e}}
.hero h1{font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1}
.hero p{margin:8px 0 0;max-width:34ch}
.hero svg{position:absolute;right:-6px;bottom:-4px;width:130px;opacity:.9}
.rank{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.rank .pill{border-color:transparent}
.namebox{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.namebox label{font-weight:800}
input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:4px;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--sea);transform:translateY(-2px)}
.tile h3{font-size:1.2rem}
.tile .sub{color:var(--muted);font-size:.92rem}
.stars{letter-spacing:2px;font-size:1.15rem;color:var(--line)}
.stars b{color:var(--sun);font-weight:400;text-shadow:0 0 0 var(--sun-ink)}
.tile.resume{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.tile.resume .sub{color:inherit}
.tile.mix{background:var(--coral);border-color:var(--coral);color:var(--coral-ink)}
.tile.mix .sub{color:inherit;opacity:.9}
.tile.mix .stars{color:rgba(255,255,255,.45)}
.tile.mix .stars b{color:#fff}
.sec{margin:22px 0 10px;font-size:1.1rem;color:var(--muted)}
.q-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.back{background:none;border:2px solid var(--line);border-radius:12px;padding:4px 12px;font-weight:800;color:var(--muted)}
.track{flex:1;height:14px;background:var(--sea-soft);border-radius:999px;position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--sea);border-radius:999px;transition:width .35s}
.track svg{position:absolute;top:-13px;width:34px;transition:left .35s;margin-left:-12px}
.streak{min-width:78px;text-align:center}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 18px}
.kind{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--sea)}
.kind.redo{color:var(--coral)}
.prompt{font-family:var(--f-display);font-weight:600;font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.15;margin:6px 0 16px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:800;font-size:1.05rem;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--sea)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.typebox{display:flex;gap:10px;flex-wrap:wrap}
.typebox input{flex:1 1 180px;font-size:1.2rem;font-weight:800}
.slots{font-family:var(--f-display);letter-spacing:.2em;color:var(--muted);margin:-6px 0 12px;min-height:1.4em}
.btn{background:var(--coral);color:var(--coral-ink);border:0;border-radius:14px;padding:12px 22px;font-weight:800;font-family:var(--f-display);font-size:1.1rem;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.small{padding:8px 14px;font-size:.95rem}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb strong{font-family:var(--f-display);font-size:1.25rem}
.fb .ans{color:var(--ink);font-weight:800}
.fb .row{display:flex;justify-content:flex-end}
.end{text-align:center}
.bigstars{font-size:3rem;letter-spacing:6px;color:var(--line);margin:6px 0}
.bigstars b{color:var(--sun);font-weight:400}
.bigstars span{display:inline-block}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0 18px}
.mist{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin:14px 0}
.mist h3{font-size:1.05rem;margin-bottom:6px}
.mist ul{margin:0;padding-left:18px}
.mist li{margin:3px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tip{color:var(--muted);font-size:.9rem;margin-top:22px}
.theme{background:none;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:800;font-size:.85rem;color:var(--muted)}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s both}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.tile,.track i,.track svg{transition:none}}
/* Seekarte */
.maphead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}
.map{display:block;width:100%;height:auto}
.map .sea{fill:var(--sea-soft)}
.map .route{fill:none;stroke:var(--sea);stroke-width:2;stroke-dasharray:4 5;opacity:.55}
.map .sand{fill:#f1d58c}
.map .green{fill:#4caf6a}
.map .pole{stroke:var(--ink);stroke-width:1.5}
.map .mapboat{color:var(--ink)}
.map text{fill:var(--ink);font:700 10px var(--f-body);text-anchor:middle}
.isl{cursor:pointer;outline:none}
.isl:hover .sand,.isl:focus-visible .sand{stroke:var(--coral);stroke-width:3}
.treasure{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;color:var(--sea);margin:4px 0 10px}
/* Satzbaukasten */
.line{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.line.right{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.line.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{background:var(--card);border:2px solid var(--sea);color:var(--ink);border-radius:12px;padding:8px 14px;font-weight:800;font-size:1.05rem}
.chip:disabled{cursor:default}
/* Memory und Blitzrunde */
.memo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:520px){.memo{grid-template-columns:repeat(4,1fr)}}
.card{min-height:86px;background:var(--sea);color:var(--card);border:2px solid var(--sea);border-radius:14px;padding:6px;font-weight:800;font-size:1rem;overflow-wrap:anywhere;transition:background .2s}
.card.up{background:var(--card);color:var(--ink)}
.card.found{background:var(--good-soft);color:var(--good);border-color:var(--good);cursor:default}
.timer i{background:var(--coral)}
.bignum{font-family:var(--f-display);font-size:4rem;font-weight:700;color:var(--sea);line-height:1;margin:8px 0}
.fb .row{gap:10px}
.prompt .btn{font-size:1.1rem}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
/* Druck: Satzbaukasten-Schreiblinie und Memory-Karten zum Ausschneiden */
.sheet small{color:#555}
.sheet .wline{border-bottom:1px solid #999;height:2em}
.sheet .cards{display:grid;grid-template-columns:repeat(4,1fr)}
.sheet .cards div{position:relative;border:1px dashed #888;min-height:3cm;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 6px 6px;font-size:1.05rem;break-inside:avoid;overflow-wrap:anywhere}
.sheet .cards small{position:absolute;top:4px;left:6px;font-size:.7rem}
/* Arbeitsblatt: auf dem Bildschirm als Vorschau, im Druck nur Blatt oder nur Lösungen (data-print am html-Element) */
.form{display:grid;gap:14px;margin-top:14px}
.form label{font-weight:800;display:grid;gap:6px}
select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.sheet{background:#fff;color:#000;border-radius:12px;padding:24px;margin:16px 0}
.sheet h2{font-size:1.3rem}
.sheet .meta{display:flex;gap:24px;flex-wrap:wrap;margin:12px 0}
.sheet table{width:100%;border-collapse:collapse}
.sheet td{border-bottom:1px solid #999;padding:12px 6px 4px;vertical-align:bottom}
.sheet td.n{width:2.5em;color:#555}
.sheet td.w{width:45%}
.sheet tr{break-inside:avoid}
@media print{
  body{background:#fff;padding:0}
  #app{max-width:none}
  .noprint{display:none!important}
  .sheet{margin:0;padding:0;border-radius:0}
  .key{break-before:page}
  [data-print=sheet] .key,[data-print=key] .ws{display:none}
  [data-print=key] .key{break-before:auto}
}
</style>

</head>

function packRound(){

  return {topic:G.topic,total:G.total,done:G.done,first:G.first,xp:G.xp,streak:G.streak,best:G.best,missed:G.missed.map(idx),
    queue:G.queue.map(q=>{const {e,...r}=q;r.i=idx(e);return r})};
}
function unpackRound(r){
  try{
    const g={topic:r.topic,total:r.total,done:r.done,first:r.first,xp:r.xp,streak:r.streak,best:r.best,answered:false,hint:false,
      missed:r.missed.map(i=>W[i]),queue:r.queue.map(q=>Object.assign({},q,{e:W[q.i]}))};
    if(g.queue.some(q=>!q.e)||g.missed.some(e=>!e))return null;
    return g;
  }catch(e){return null}
}

function distractors(e,label){ // bis zu 3 andere Antworten, zuerst von derselben Insel
  const mine=label(e),seen=new Set([mine]),d=[];
  for(const x of shuffle(W.filter(x=>x!==e&&x[0]===e[0])).concat(shuffle(W.filter(x=>x[0]!==e[0])))){const l=label(x);if(!seen.has(l)){seen.add(l);d.push(l)}if(d.length>=3)break}

}

let VOICE=null;

const ODD=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Pipe Organ|Ralph|Fred|Kathy|Superstar|Trinoids|Whisper|Wobble|Zarvox)\b/i;
function pickVoice(){
  try{
    const score=v=>(/^en[-_]GB/i.test(v.lang)?4:/^en[-_](US|IE|AU)/i.test(v.lang)?2:0)+(/Enhanced|Premium|verbessert/i.test(v.name)?3:0)+(v.default?1:0);
    const vs=speechSynthesis.getVoices().filter(v=>v.localService&&/^en[-_]/i.test(v.lang)&&!ODD.test(v.name));
    VOICE=vs.sort((a,b)=>score(b)-score(a))[0]||null;
  }catch(e){VOICE=null}
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=()=>{const had=!!VOICE;pickVoice();if(!had&&VOICE&&$('#nm')&&document.activeElement.id!=='nm')home()}}

function say(t,slow){
  if(!canSpeak())return;
  try{if(speechSynthesis.speaking)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\.\.\./g,' ').replace(/\//g,', '));u.voice=VOICE;u.lang=VOICE.lang;u.rate=slow?.55:.9;speechSynthesis.speak(u)}catch(e){}
}

function seaMap(){

    return `<g class="isl" data-t="${t.id}" tabindex="0" role="button" aria-label="${t.name}, ${n} von 3 Sternen">
     <ellipse class="sand" cx="${x}" cy="${y}" rx="25" ry="11"/><ellipse class="green" cx="${x-5}" cy="${y-3}" rx="12" ry="5"/>
     ${n>=3?chest(x-14,y-20):n>0?flag(x-12,y-22):''}<text x="${x}" y="${y+23}">${esc(t.map)}</text></g>`}).join('');

}

const poolFor=topic=>W.filter(e=>topic==='mix'||(topic==='words'?!NOTYPE.includes(e[0]):e[0]===topic));
function pickEntries(topic,n=ROUND){
  const pool=poolFor(topic);
  // schwache Wörter häufiger ziehen
  const weighted=[];pool.forEach(e=>{const w=1+Math.min(3,save.weak[key(e)]||0);for(let i=0;i<w;i++)weighted.push(e)});
  const out=[];for(const e of shuffle(weighted)){if(!out.includes(e))out.push(e);if(out.length>=Math.min(n,pool.length))break}
  return out;
}
function pickKind(e,quick){
  // Gewichte je Fragetyp. quick = Blitzrunde, dort nur schnelle Typen.
  const w=quick?{mc:3,tf:2}:NOTYPE.includes(e[0])?{mc:4,build:canBuild(e)?4:0,listen:2,tf:1}:{mc:3,type:3,listen:2,tf:2};
  if(!canSpeak())w.listen=0;
  let r=Math.random()*Object.values(w).reduce((a,b)=>a+b,0);
  for(const k in w)if((r-=w[k])<0)return k;
  return 'mc';
}
function makeQ(e,forceMC,quick){
  const kind=forceMC?'mc':pickKind(e,quick);
  const q={e,kind,type:kind==='type',redo:!!forceMC,dir:kind==='type'||kind==='listen'?'de2en':(Math.random()<.5?'en2de':'de2en')};
  if(kind==='mc'||kind==='listen'){
    const label=x=>q.dir==='en2de'?deShow(x):enShow(x);
    q.correct=label(e);q.options=shuffle([q.correct].concat(distractors(e,label)));
  }else if(kind==='tf'){
    q.shown=tfShown(e);q.options=['Stimmt','Stimmt nicht'];q.correct=q.shown===deShow(e)?'Stimmt':'Stimmt nicht';
  }else if(kind==='build')q.tiles=scramble(toks(enShow(e)));
  return q;
}
const kindOf=q=>q.kind||(q.type?'type':'mc'); // gespeicherte Runden von früher kennen nur type/mc
const optsHtml=q=>`<div class="opts" role="group" aria-label="Antworten, mit Pfeiltasten wählen">${q.options.map((o,i)=>`<button class="opt nav" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
const promptOf=(q,e)=>kindOf(q)==='tf'?`${enShow(e)} = ${q.shown}`:q.dir==='en2de'?enShow(e):deShow(e);
const labelOf=q=>({type:'Schreibe das englische Wort',listen:'Was hörst du?',tf:'Stimmt das?',build:'Bau den englischen Satz'}[kindOf(q)]||(q.dir==='en2de'?'Was heißt das auf Deutsch?':'Wie heißt das auf Englisch?'));
function markOpts(q,i){document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(q.options[k]===q.correct)b.classList.add('right');else if(k===i)b.classList.add('wrong')})}

function start(topic){
  const es=pickEntries(topic);
  G={topic,queue:es.map(e=>makeQ(e)),total:es.length,done:0,first:0,xp:0,streak:0,best:0,missed:[],answered:false};
  show();
}
function pillStreak(){return `<span class="pill streak">${G.streak>=2?'Serie '+G.streak:'Serie 0'}</span>`}
function show(){
  if(!G.queue.length)return finish();
  const q=G.queue[0],e=q.e,kind=kindOf(q);
  if(kind==='listen'&&!canSpeak()){G.queue[0]=makeQ(e,true);return show()} // Ton inzwischen aus
  saveRound();
  const pct=Math.round(G.done/G.total*100);
  let prompt=esc(promptOf(q,e)),body;
  if(kind==='listen')prompt=`<button class="btn" id="hear" type="button">🔊 Anhören</button> <button class="btn ghost small" id="slow" type="button">🐢 langsam</button>`;
  if(kind==='type'){
    const target=enShow(e);
    body=`<div class="slots" id="slots" aria-hidden="true">${target.split('').map(c=>c===' '?'  ':'_').join(' ')}</div>
    <form class="typebox" id="tf" autocomplete="off"><input type="text" id="ti" aria-label="Englisches Wort" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="English"><button class="btn" type="submit">Prüfen</button></form>
    <p style="margin:12px 0 0"><button class="btn ghost small" id="hint" type="button">Tipp: erster Buchstabe</button></p>`;
  }else if(kind==='build'){
    body=`<div class="line" id="bl" aria-label="Dein Satz"></div>
    <div class="chips" id="bc" role="group" aria-label="Wörter, mit Pfeiltasten wählen">${q.tiles.map(t=>`<button class="chip nav" type="button">${esc(t)}</button>`).join('')}</div>
    <p style="margin:12px 0 0"><button class="btn" id="bp" type="button">Prüfen</button></p>`;
  }else body=optsHtml(q);
  $('#app').innerHTML=`
  <div class="q-head"><button class="back" id="bk" aria-label="Zurück zur Seekarte">Ende</button>
   <div class="track" role="progressbar" aria-valuenow="${G.done}" aria-valuemax="${G.total}"><i style="width:${pct}%"></i><span style="position:absolute;left:calc(${pct}% );top:0">${boat.replace('<svg','<svg style="position:absolute;top:-14px;left:-12px;width:34px;color:var(--ink)"')}</span></div>
   ${pillStreak()}</div>
  <div class="qcard"><div class="kind ${q.redo?'redo':''}">${q.redo?'Noch einmal üben':labelOf(q)}</div><div class="prompt">${prompt}</div>${body}<div id="fb"></div></div>`;
  G.answered=false;G.hint=false;
  $('#bk').onclick=home;
  if(kind==='type'){
    $('#ti').focus();
    $('#tf').onsubmit=ev=>{ev.preventDefault();if(G.answered)return;answer(null,$('#ti').value)};
    $('#hint').onclick=()=>{G.hint=true;const t=enShow(e);$('#slots').textContent=t[0]+' '+t.slice(1).split('').map(c=>c===' '?'  ':'_').join(' ');$('#hint').disabled=true;$('#ti').focus()};
  }else if(kind==='build'){
    // Antippen schiebt ein Wort in den Satz, nochmal antippen schiebt es zurück
    document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(G.answered)return;const from=b.parentNode;(from.id==='bc'?$('#bl'):$('#bc')).appendChild(b);(from.querySelector('.chip')||$('#bp')).focus()});
    $('#bp').onclick=()=>{if(G.answered)return;if($('#bc').children.length){$('#fb').innerHTML='<p class="tip">Benutze alle Wörter.</p>';return}answer(null,[...$('#bl').children].map(c=>c.textContent).join(' '))};
  }else{
    if(kind==='listen'){say(enShow(e));$('#hear').onclick=()=>say(enShow(e));$('#slow').onclick=()=>say(enShow(e),true)}
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i,null));
  }
}
function answer(i,text){
  if(G.answered)return;
  const q=G.queue[0],e=q.e,kind=kindOf(q);let ok,caseOnly=false;
  if(kind==='type'){
    const t=norm(text||'');if(!t){$('#ti').focus();return}
    const alts=e[1].split('|').map(norm);
    ok=alts.includes(t); // Groß- und Kleinschreibung zählt
    caseOnly=!ok&&alts.some(a=>a.toLowerCase()===t.toLowerCase());
    $('#ti').disabled=true;document.querySelector('#tf button').disabled=true;
  }else if(kind==='build'){
    ok=text===toks(enShow(e)).join(' ');
    document.querySelectorAll('.chip').forEach(b=>b.disabled=true);$('#bp').disabled=true;$('#bl').classList.add(ok?'right':'wrong');
  }else{ok=q.options[i]===q.correct;markOpts(q,i)}
  G.answered=true;
  const k=key(e);
  if(!q.redo){
    if(ok){G.first++;G.streak++;G.best=Math.max(G.best,G.streak);const gain=(G.hint?5:10)+Math.min(G.streak-1,5);G.xp+=gain;save.xp+=gain;if(save.weak[k])save.weak[k]--}
    else{G.streak=0;save.weak[k]=(save.weak[k]||0)+1;G.missed.push(e);G.queue.push(makeQ(e,true))}
    G.done++;
  }else if(!ok){G.queue.push(makeQ(e,true))}
  persist();
  const ans=`${esc(enShow(e))} = ${esc(deShow(e))}`;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}" role="status"><strong>${ok?pick(CHEER):caseOnly?'Fast! Achte auf Groß- und Kleinschreibung.':pick(OOPS)}</strong>
   <span class="ans">${ok?ans:'Richtig ist: '+ans}</span>
   <div class="row">${canSpeak()?'<button class="btn ghost small" id="say" type="button" style="margin-right:auto">🔊 Anhören</button>':''}<button class="btn" id="nx">${G.queue.length>1?'Weiter':'Fertig'}</button></div></div>`;
  if($('#say'))$('#say').onclick=()=>say(enShow(e));
  $('#nx').focus();
  $('#nx').onclick=()=>{G.queue.shift();show()};
  document.querySelector('.streak').textContent=G.streak>=2?'Serie '+G.streak:'Serie 0';
}
function finish(){
  const n=G.first,stars=n>=9?3:n>=7?2:n>=5?1:0;
  const tk=G.topic,before=save.best[tk]||0;if(stars>before)save.best[tk]=stars;
  const bonus=stars*10;G.xp+=bonus;save.xp+=bonus;save.round=null;persist();
  const msg=stars===3?'Insel erobert. Das war Spitze!':stars===2?'Sehr gut! Eine Runde noch für den dritten Stern?':stars===1?'Gut gemacht. Mit etwas Übung klappen mehr Sterne.':'Das war ein Anfang. Probiere es noch einmal, es wird jedes Mal leichter.';
  const treasure=stars===3&&before<3&&tk!=='mix'?`<p class="treasure pop"><svg viewBox="0 0 18 16" width="40" aria-hidden="true">${chest(0,0)}</svg> Du hast den Schatz der ${esc(TOPICS.find(t=>t.id===tk).name)} gefunden!</p>`:'';
  const memoTopic=tk==='mix'?'words':tk;
  $('#app').innerHTML=`${topBar()}
  <div class="qcard end"><h2>${esc(msg)}</h2>
   <div class="bigstars" aria-label="${stars} von 3 Sternen">${[1,2,3].map(i=>i<=stars?`<b><span class="pop" style="animation-delay:${i*.25}s">★</span></b>`:'★').join('')}</div>
   ${treasure}
   <div class="stats"><span class="pill">${n} von ${G.total} gleich richtig</span><span class="pill">Beste Serie ${G.best}</span><span class="pill sun">+${G.xp} Punkte</span></div>
   ${mistList(G.missed)}
   <div class="actions"><button class="btn" id="again">Nochmal spielen</button>${NOTYPE.includes(tk)?'':'<button class="btn ghost" id="mm">Memory mit diesen Wörtern</button>'}<button class="btn ghost" id="hm">Zur Seekarte</button></div>
   <p class="tip">Rang: ${rank()} · ${save.xp} Punkte insgesamt</p></div>`;
  bindTheme();
  $('#again').onclick=()=>start(tk);$('#hm').onclick=home;if($('#mm'))$('#mm').onclick=()=>memory(memoTopic);
}

/* ---------- Blitzrunde: 60 Sekunden, nur Antippen ---------- */
function blitz(){
  G=null;M=null;
  B={end:Date.now()+BLITZ*1000,ok:0,missed:[],last:null};
  B.timer=setTimeout(blitzEnd,BLITZ*1000);
  blitzQ();
}
function blitzQ(){
  if(!B)return;
  let e;do e=pickEntries('mix',1)[0];while(e===B.last);B.last=e;
  const q=makeQ(e,false,true),left=Math.max(0,B.end-Date.now()),busy={v:false};
  $('#app').innerHTML=`<div class="q-head"><button class="back" id="bk" aria-label="Blitzrunde beenden">Ende</button>
   <div class="track timer" role="timer" aria-label="Restzeit"><i id="tm" style="width:${left/BLITZ/10}%;transition:width ${left}ms linear"></i></div>
   <span class="pill sun" id="bs">${B.ok} richtig</span></div>
  <div class="qcard"><div class="kind">Blitzrunde · ${labelOf(q)}</div><div class="prompt">${esc(promptOf(q,e))}</div>${optsHtml(q)}</div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const t=$('#tm');if(t)t.style.width='0%'}));
  $('#bk').onclick=home;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(busy.v||!B)return;busy.v=true;
    const i=+b.dataset.i,ok=q.options[i]===q.correct,k=key(e);markOpts(q,i);
    if(ok){B.ok++;save.xp+=3;if(save.weak[k])save.weak[k]--}else{if(!B.missed.includes(e))B.missed.push(e);save.weak[k]=(save.weak[k]||0)+1}
    persist();$('#bs').textContent=B.ok+' richtig';
    setTimeout(()=>{if(B&&Date.now()<B.end)blitzQ()},ok?450:1300);
  });
}
function blitzEnd(){
  if(!B)return;const r=B;B=null;
  const rec=r.ok>0&&r.ok>(save.blitz||0);if(rec)save.blitz=r.ok;persist();
  $('#app').innerHTML=`${topBar()}
  <div class="qcard end"><h2>${rec?'Neuer Rekord!':'Zeit ist um!'}</h2>
   <div class="bignum pop">${r.ok}</div><p>richtige Antworten in ${BLITZ} Sekunden</p>
   <div class="stats"><span class="pill">Rekord: ${save.blitz||0}</span><span class="pill sun">+${r.ok*3} Punkte</span></div>
   ${mistList(r.missed)}
   <div class="actions"><button class="btn" id="again">Nochmal</button><button class="btn ghost" id="hm">Zur Seekarte</button></div></div>`;
  bindTheme();$('#again').onclick=blitz;$('#hm').onclick=home;$('#again').focus();
}

/* ---------- Memory: englisches Wort und deutsche Bedeutung als Paar ---------- */
function memory(topic){
  G=null;if(B){clearTimeout(B.timer);B=null}
  const es=pickEntries(topic,PAIRS);
  M={topic,tries:0,open:[],found:0,pairs:es.length,lock:false,cards:shuffle(es.flatMap(e=>[{e,t:enShow(e),en:true},{e,t:deShow(e),en:false}]))};
  $('#app').innerHTML=`<div class="q-head"><button class="back" id="bk" aria-label="Memory beenden">Ende</button><span class="brand" style="flex:1;text-align:center">Memory</span><span class="pill" id="mt">0 Züge</span></div>
   <p class="tip" style="margin:0 0 12px">Finde die Paare: englisches Wort und deutsche Bedeutung.</p>
   <div class="memo" role="group" aria-label="Karten, mit Pfeiltasten wählen">${M.cards.map((c,i)=>`<button class="card nav" data-i="${i}" aria-label="Verdeckte Karte">?</button>`).join('')}</div>`;
  $('#bk').onclick=home;
  document.querySelectorAll('.card').forEach(b=>b.onclick=()=>flip(b));
}
function flip(b){
  const c=M&&M.cards[+b.dataset.i];
  if(!c||M.lock||c.found||M.open.includes(b))return;
  b.textContent=c.t;b.classList.add('up');b.setAttribute('aria-label',c.t);if(c.en)say(c.t);
  M.open.push(b);if(M.open.length<2)return;
  M.tries++;$('#mt').textContent=M.tries+(M.tries===1?' Zug':' Züge');
  const [x,y]=M.open.map(o=>M.cards[+o.dataset.i]);
  if(x.e===y.e){x.found=y.found=true;M.open.forEach(o=>{o.classList.add('found');o.disabled=true});M.open=[];if(++M.found===M.pairs)setTimeout(memoEnd,700)}
  else{M.lock=true;setTimeout(()=>{if(!M)return;M.open.forEach(o=>{o.textContent='?';o.classList.remove('up');o.setAttribute('aria-label','Verdeckte Karte')});M.open=[];M.lock=false},1100)}
}
function memoEnd(){
  if(!M)return;const r=M;M=null;
  const gain=10+r.pairs*2,rec=!save.memo||r.tries<save.memo;if(rec)save.memo=r.tries;save.xp+=gain;persist();
  $('#app').innerHTML=`${topBar()}
  <div class="qcard end"><h2>${rec?'Neuer Rekord!':'Alle Paare gefunden!'}</h2>
   <div class="bignum pop">${r.tries}</div><p>Züge für ${r.pairs} Paare</p>
   <div class="stats"><span class="pill">Rekord: ${save.memo} Züge</span><span class="pill sun">+${gain} Punkte</span></div>
   <div class="mist"><h3>Deine Paare</h3><ul>${[...new Set(r.cards.map(c=>c.e))].map(e=>`<li><b>${esc(enShow(e))}</b> = ${esc(deShow(e))}</li>`).join('')}</ul></div>
   <div class="actions"><button class="btn" id="again">Nochmal</button><button class="btn ghost" id="hm">Zur Seekarte</button></div></div>`;
  bindTheme();$('#again').onclick=()=>memory(r.topic);$('#hm').onclick=home;$('#again').focus();
}

/* ---------- Arbeitsblatt drucken / als PDF sichern ---------- */
const SHEETS={uebersetzen:'Übersetzen',diktat:'Diktat',tf:'Richtig oder falsch',build:'Satzbaukasten',memory:'Memory-Karten'};
function sheetSetup(){
  G=null;
  $('#app').innerHTML=`<div class="top noprint"><span class="brand">Vokabel-Inseln</span>${themeBtn()}</div>
  <div class="qcard noprint"><h2>Arbeitsblatt als PDF</h2>
   <p>Erstellt ein Arbeitsblatt und ein separates Lösungsblatt mit denselben Wörtern. Jedes Blatt einzeln drucken oder im Druckdialog als PDF sichern (PC/Mac: „Als PDF speichern“; iPad/iPhone: im Druckdialog auf die Vorschau tippen, dann teilen oder sichern).</p>
   <form class="form" id="sf">
    <label>Aufgabe<select id="sk"><option value="uebersetzen">Übersetzen</option><option value="diktat">Diktat (jemand liest vor)</option><option value="tf">Richtig oder falsch</option><option value="build">Satzbaukasten (Sätze ordnen)</option><option value="memory">Memory-Karten zum Ausschneiden</option></select></label>
    <label>Insel<select id="st"><option value="mix">Alle Inseln</option>${TOPICS.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></label>
    <label id="sdw">Richtung<select id="sd"><option value="en2de">Englisch → Deutsch</option><option value="de2en">Deutsch → Englisch</option><option value="mix">gemischt</option></select></label>
    <label>Anzahl<select id="sn"><option value="0">alle</option><option>10</option><option>20</option><option>30</option></select></label>
    <div class="actions" style="justify-content:flex-start"><button class="btn" type="submit">Arbeitsblatt erstellen</button><button class="btn ghost" type="button" id="hm">Zurück</button></div>
   </form></div><div id="out"></div>`;
  bindTheme();
  $('#hm').onclick=home;
  $('#sk').onchange=()=>{$('#sdw').hidden=$('#sk').value!=='uebersetzen'};
  $('#sf').onsubmit=ev=>{ev.preventDefault();buildSheet($('#sk').value,$('#st').value,$('#sd').value,+$('#sn').value)};
}
function buildSheet(kind,topic,dir,n){
  let es=shuffle(poolFor(topic)),note='';
  if(kind==='build'){es=es.filter(canBuild);if(!es.length){es=shuffle(W.filter(canBuild));note=' (Sätze von allen Inseln)'}}
  if(n)es=es.slice(0,n);
  const title=`Englisch 5: ${topic==='mix'?'Alle Inseln':TOPICS.find(t=>t.id===topic).name}${note} · ${SHEETS[kind]}`;
  let task,rows,stacked=false;
  if(kind==='diktat'){task='Hör gut zu und schreibe das englische Wort oder den Satz auf.';rows=es.map(e=>({q:'',sol:`${allEn(e)}  (${deShow(e)})`}))}
  else if(kind==='tf'){task='Stimmt die Übersetzung? Kreuze an.';rows=es.map(e=>{const s=tfShown(e),t=s===deShow(e);return {q:`${enShow(e)} = ${s}`,ws:'☐ richtig    ☐ falsch',sol:t?'richtig':'falsch, richtig ist: '+deShow(e)}})}
  else if(kind==='build'){task='Bring die Wörter in die richtige Reihenfolge und schreibe den Satz auf.';stacked=true;rows=es.map(e=>({q:scramble(toks(enShow(e))).join('   /   '),hint:deShow(e),sol:enShow(e)}))}
  else if(kind==='memory'){task='Karten ausschneiden, verdeckt mischen und Paare finden: englisches Wort und deutsche Bedeutung.';rows=es.map(e=>({q:enShow(e),sol:deShow(e)}))}
  else{task=dir==='en2de'?'Schreibe das deutsche Wort daneben.':dir==='de2en'?'Schreibe das englische Wort daneben.':'Übersetze ins Deutsche oder ins Englische.';
    rows=es.map(e=>{const d=dir==='mix'?(Math.random()<.5?'en2de':'de2en'):dir;return d==='en2de'?{q:enShow(e),sol:deShow(e)}:{q:deShow(e),sol:allEn(e)}})}
  const cell=r=>esc(r.q)+(r.hint?`<br><small>${esc(r.hint)}</small>`:'');
  const table=sol=>`<table>${rows.map((r,i)=>`<tr><td class="n">${i+1}.</td>${
    stacked?`<td>${cell(r)}${sol?`<br><b>${esc(r.sol)}</b>`:'<div class="wline"></div>'}</td>`
    :kind==='diktat'?`<td>${sol?esc(r.sol):''}</td>`
    :`<td class="w">${cell(r)}</td><td>${sol?esc(r.sol):esc(r.ws||'')}</td>`}</tr>`).join('')}</table>`;
  const cards=()=>`<div class="cards">${shuffle(rows.flatMap(r=>[[r.q,'EN'],[r.sol,'DE']])).map(([t,l])=>`<div><small>${l}</small>${esc(t)}</div>`).join('')}</div>`;
  const [lw,lk,hk]=kind==='memory'?['Karten drucken','Paarliste drucken','Paarliste: ']:kind==='diktat'?['Arbeitsblatt drucken','Vorlese-Liste drucken','Zum Vorlesen (mit Lösungen): ']:['Arbeitsblatt drucken','Lösungen drucken','Lösungen: '];
  $('#out').innerHTML=`<div class="actions noprint" style="margin-top:16px"><button class="btn" id="pw">${lw}</button><button class="btn" id="pk">${lk}</button><button class="btn ghost" id="rx">Neu mischen</button></div>
   <section class="sheet ws"><h2>${esc(title)}</h2>${kind==='memory'?'':'<div class="meta"><span>Name: ________________________</span><span>Datum: ______________</span></div>'}<p>${task}</p>${kind==='memory'?cards():table(false)}</section>
   <section class="sheet key"><h2>${hk}${esc(title)}</h2>${kind==='memory'?`<table>${rows.map((r,i)=>`<tr><td class="n">${i+1}.</td><td class="w">${esc(r.q)}</td><td>${esc(r.sol)}</td></tr>`).join('')}</table>`:table(true)}</section>`;
  // ohne Knopf (Strg+P) wird beides gedruckt, die Lösungen auf neuer Seite
  const pr=m=>{document.documentElement.dataset.print=m;window.print()};
  $('#pw').onclick=()=>pr('sheet');$('#pk').onclick=()=>pr('key');
  $('#rx').onclick=()=>buildSheet(kind,topic,dir,n);
}

/* ---------- Tastatur ---------- */
document.addEventListener('keydown',ev=>{
  // Pfeiltasten wandern durch Antworten, Satzwörter und Memory-Karten (rundherum); Enter/Leertaste wählt wie bei jedem Knopf
  const os=[...document.querySelectorAll('.nav:not(:disabled)')];
  if(os.length&&/^Arrow(Up|Down|Left|Right)$/.test(ev.key)&&document.activeElement.tagName!=='INPUT'){
    const i=os.indexOf(document.activeElement),d=/Up|Left/.test(ev.key)?-1:1;
    ev.preventDefault();os[i<0?(d>0?0:os.length-1):(i+d+os.length)%os.length].focus();return;
  }
  if(!G||!G.answered)return;
  if(ev.key==='Enter'){const b=$('#nx');if(b&&document.activeElement!==b&&document.activeElement.id!=='say'){ev.preventDefault();b.click()}}
});

home();
</script>
