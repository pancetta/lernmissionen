<title>Tausender-Inseln</title>

<body>
<div id="app"></div>
<script src="../../gemeinsam/gemeinsam.js"></script>
<script src="../../gemeinsam/runde.js"></script>
<script src="../../gemeinsam/spiele.js"></script>
<script>
const BRAND='Tausender-Inseln',MISSED='Diese Aufgaben üben wir weiter';
const TOPICS=[
 {id:'bild',name:'Zahlbild-Insel',map:'Zahlbilder',sub:'Geheimschrift und Plättchen',can:'Zahlbilder lesen und zeichnen, Plättchen in der Stellenwerttafel'},
 {id:'buch',name:'Tausenderbuch-Insel',map:'Tausenderbuch',sub:'Hundertertafeln: unter, über, neben',can:'mich im Tausenderbuch zurechtfinden'},
 {id:'zerlegen',name:'Zerlege-Insel',map:'Zerlegen',sub:'637 = 600 + 30 + 7',can:'Zahlen zerlegen'},
 {id:'wort',name:'Zahlwort-Insel',map:'Zahlwörter',sub:'einhundertsiebenunddreißig',can:'Zahlwörter lesen'},
 {id:'strahl',name:'Zahlenstrahl-Insel',map:'Zahlenstrahl',sub:'ablesen und eintragen',can:'Zahlen am Zahlenstrahl ablesen'},
 {id:'nachbar',name:'Nachbar-Insel',map:'Nachbarn',sub:'Nachbarzahlen, -zehner, -hunderter',can:'Nachbarzahlen, Nachbarzehner und Nachbarhunderter finden'},
 {id:'ordnen',name:'Ordnungs-Insel',map:'Ordnen',sub:'größer, kleiner, der Reihe nach',can:'Zahlen der Größe nach ordnen'},
 {id:'koerper',name:'Körper-Insel',map:'Körper',sub:'Würfel, Quader, Kugel …',can:'geometrische Körper erkennen'}
];
const MAP=[[45,42],[125,42],[205,42],[285,42],[285,118],[205,118],[125,118],[45,118]]; // Seekarte, Reihenfolge wie TOPICS

/* ---------- Hilfen ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));                 // ganze Zufallszahl von a bis b
const BLOB='<span class="blob" aria-label="Klecks">●</span>';
const mc=o=>Object.assign({kind:'mc'},o);
const uniq=a=>[...new Set(a)];
function opts4(correct,cands){return shuffle([correct].concat(shuffle(uniq(cands).filter(x=>x!==correct)).slice(0,3)))}
const num=(html,ans,sol,label)=>({kind:'num',html,ans,sol,label});
const big=t=>`<p class="big">${t}</p>`;
const hze=n=>[Math.floor(n/100)%10,Math.floor(n/10)%10,n%10];
const wert=([h,z,e])=>h*100+z*10+e;
function zahl3(){const d=hze(R(100,999));if(Math.random()<.25)d[pick([1,2])]=0;return wert(d)} // manchmal mit einer 0 (305, 740)
const STELLE={H:'Hundertern',Z:'Zehnern',E:'Einern'},HZE=['H','Z','E'];
const stk=(n,eins,viele)=>`${n} ${n===1?eins:viele}`,bildText=([h,z,e])=>`${stk(h,'Quadrat','Quadrate')}, ${stk(z,'Strich','Striche')}, ${stk(e,'Punkt','Punkte')}`;
const ziffernVon=n=>uniq(String(n).split('')).length===String(n).length; // alle Ziffern verschieden

/* ---------- Zahlwörter ---------- */
const ONES=['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
function w999(n){const h=Math.floor(n/100),r=n%100;let s=h?ONES[h]+'hundert':'';if(r)s+=r<20?ONES[r]:(r%10?ONES[r%10]+'und':'')+TENS[Math.floor(r/10)];return s}
const words=n=>n===1000?'eintausend':w999(n)+(n%100===1?'s':'');

/* ---------- Bilder: Geheimschrift, Plättchen, Zahlenstrahl ---------- */
function geheim(n){ // Quadrate = Hunderter, Striche = Zehner, Punkte = Einer
  const [h,z,e]=hze(n);let s='',x=4;
  for(let i=0;i<h;i++)s+=`<rect class="hq" x="${4+(i%5)*30}" y="${4+Math.floor(i/5)*32}" width="26" height="26"/>`;
  if(h)x+=Math.min(h,5)*30+6;
  for(let i=0;i<z;i++)s+=`<line class="zs" x1="${x}" x2="${x+30}" y1="${8+i*6.5}" y2="${8+i*6.5}"/>`;
  if(z)x+=38;
  for(let i=0;i<e;i++)s+=`<circle class="ep" cx="${x+4+(i%5)*9}" cy="${10+Math.floor(i/5)*10}" r="3"/>`;
  if(e)x+=Math.min(e,5)*9+4;
  return `<svg class="geheim" viewBox="0 0 ${Math.max(x,40)} 68" role="img" aria-label="Zahlbild: ${h} Quadrate, ${z} Striche, ${e} Punkte">${s}</svg>`;
}
const plaettchen=n=>`<table class="stw" aria-label="Stellenwerttafel mit Plättchen"><tr><th>H</th><th>Z</th><th>E</th></tr><tr>${hze(n).map(k=>`<td>${'<i class="pl"></i>'.repeat(k)}</td>`).join('')}</tr></table>`;
const SX=k=>30+k*13; // Teilstrich k auf dem Zahlenstrahl
function strahlSvg(start,step,i){ // 20 Teilstriche, beschriftet bei 0, 10 und 20; Pfeil bei Teilstrich i (ohne Pfeil: i = null)
  let s=`<svg class="strahl" viewBox="0 0 320 74" role="img" aria-label="Zahlenstrahl"><line class="axis" x1="22" x2="298" y1="44" y2="44"/>`;
  for(let k=0;k<=20;k++){const h=k%10===0?9:k%5===0?6:4;s+=`<line class="axis" x1="${SX(k)}" x2="${SX(k)}" y1="${44-h}" y2="${44+h}"/>`;if(k%10===0)s+=`<text x="${SX(k)}" y="68" text-anchor="middle" font-size="12">${start+k*step}</text>`}
  return s+(i===null?'':`<path class="arrow" d="M${SX(i)} 31 l-6 -12 h12 z"/><line class="arrowline" x1="${SX(i)}" x2="${SX(i)}" y1="4" y2="22"/>`)+'</svg>';
}
const strahl0=st=>R(0,Math.floor((1000-20*st)/(10*st)))*10*st; // der ganze Strahl liegt zwischen 0 und 1000
const svgPt=(svg,ev)=>{const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;return {x:(ev.clientX-r.left)*vb.width/r.width,y:(ev.clientY-r.top)*vb.height/r.height}};
const arrowAt=(k,cls)=>`<g class="mark ${cls}" transform="translate(${SX(k)} 0)"><path d="M0 31 l-6 -12 h12 z"/><line x1="0" x2="0" y1="4" y2="22"/></g>`;
function markSvg(q){ // Zahlenstrahl ohne Pfeil, der Pfeil wird gesetzt
  let s=`<svg class="strahl marksvg" viewBox="0 0 320 74" tabindex="0" role="slider" aria-label="Zahlenstrahl: Pfeil setzen" aria-valuemin="0" aria-valuemax="20"><line class="axis" x1="22" x2="298" y1="44" y2="44"/>`;
  for(let t=0;t<=20;t++){const h=t%10===0?9:t%5===0?6:4;s+=`<line class="axis" x1="${SX(t)}" x2="${SX(t)}" y1="${44-h}" y2="${44+h}"/>`;if(t%10===0)s+=`<text x="${SX(t)}" y="68" text-anchor="middle" font-size="12">${q.start+t*q.step}</text>`}
  return s+`<rect class="hit" x="0" y="0" width="320" height="74"/><g class="mark live" style="display:none"><path d="M0 31 l-6 -12 h12 z"/><line x1="0" x2="0" y1="4" y2="22"/></g></svg>`;
}
// Geometrische Körper als einfache Strichzeichnungen; verdeckte Kanten gestrichelt
const KSVG={
 'Würfel':'<path d="M20 40h50v50h-50zM20 40l22-22h50l-22 22M70 90l22-22v-50"/><path class="dash" d="M20 90l22-22h50M42 68v-50"/>',
 'Quader':'<path d="M10 50h76v40h-76zM10 50l20-18h76l-20 18M86 90l20-18v-40"/><path class="dash" d="M10 90l20-18h76M30 72v-40"/>',
 'Kugel':'<circle cx="60" cy="55" r="38"/><path d="M22 55a38 11 0 0 0 76 0"/><path class="dash" d="M22 55a38 11 0 0 1 76 0"/>',
 'Zylinder':'<ellipse cx="60" cy="22" rx="32" ry="10"/><path d="M28 22v62a32 10 0 0 0 64 0v-62"/><path class="dash" d="M28 84a32 10 0 0 1 64 0"/>',
 'Kegel':'<path d="M60 8L26 82a34 10 0 0 0 68 0Z"/><path class="dash" d="M26 82a34 10 0 0 1 68 0"/>',
 'Pyramide':'<path d="M60 8L18 80h60zM60 8l42 52-24 20"/><path class="dash" d="M18 80l24-20h60M60 8l-18 52"/>'
};
const KOERPER=Object.keys(KSVG);
const koerperSvg=k=>`<svg class="koerper" viewBox="0 0 120 100" role="img" aria-label="ein geometrischer Körper">${KSVG[k]}</svg>`;
const paarFrei=(ok,os)=>os.filter(o=>!(ok==='Würfel'&&o==='Quader'||ok==='Quader'&&o==='Würfel')); // ein Würfel ist auch ein besonderer Quader: nie beide anbieten

/* ---------- Zum Zeichnen und Setzen ---------- */
let WS=null; // Zustand der gerade sichtbaren Zeichen- oder Setz-Aufgabe (wird nicht gespeichert)
const ZEICHEN={geheim:{bild:geheim,namen:['Quadrate (Hunderter)','Striche (Zehner)','Punkte (Einer)']},plaettchen:{bild:plaettchen,namen:['Plättchen bei H','Plättchen bei Z','Plättchen bei E']}};
const WIDGETS={
 zeichnen:{
  html:q=>`<div class="zbild" id="zb"></div><div class="zaehler">${ZEICHEN[q.stil].namen.map((t,i)=>`<div class="zr"><span>${t}</span><button class="btn ghost small" type="button" data-i="${i}" data-s="-1" aria-label="${t}: eins weniger">−</button><b id="zc${i}">0</b><button class="btn ghost small" type="button" data-i="${i}" data-s="1" aria-label="${t}: eins mehr">+</button></div>`).join('')}</div>`,
  init(q){const c=[0,0,0],draw=()=>{$('#zb').innerHTML=ZEICHEN[q.stil].bild(wert(c));c.forEach((v,i)=>$('#zc'+i).textContent=v)};
   WS={c,fill:n=>{hze(n).forEach((d,i)=>c[i]=d);draw()}};
   document.querySelectorAll('.zaehler button').forEach(b=>b.onclick=()=>{if(G.answered)return;const i=+b.dataset.i;c[i]=Math.max(0,Math.min(9,c[i]+ +b.dataset.s));draw()});draw()},
  empty:()=>WS.c.some(Boolean)?'':'Tippe auf +, um zu zeichnen.',
  check:q=>wert(WS.c)===q.ans,
  done(q,ok){document.querySelectorAll('.zaehler button').forEach(b=>b.disabled=true);if(!ok)$('#zb').insertAdjacentHTML('afterend',`<p class="tip">So ist es richtig:</p>${ZEICHEN[q.stil].bild(q.ans)}`)}
 },
 strahl:{
  html:q=>`<p class="tip" style="margin:0 0 6px">Tippe auf den richtigen Teilstrich oder zieh den Pfeil dorthin. Mit der Tastatur: Zahlenstrahl auswählen, dann Pfeiltasten.</p>${markSvg(q)}`,
  init(q){
    const svg=$('.marksvg');WS={k:null,svg};
    const put=k=>{k=Math.max(0,Math.min(20,k));WS.k=k;const m=svg.querySelector('.mark.live');m.setAttribute('transform',`translate(${SX(k)} 0)`);m.style.display='';
      svg.setAttribute('aria-valuenow',k);svg.setAttribute('aria-valuetext',q.start+k*q.step)};
    WS.put=put;let drag=false;const at=ev=>Math.round((svgPt(svg,ev).x-30)/13);
    svg.onpointerdown=ev=>{if(G.answered)return;drag=true;try{svg.setPointerCapture(ev.pointerId)}catch(e){}put(at(ev));ev.preventDefault()};
    svg.onpointermove=ev=>{if(drag&&!G.answered)put(at(ev))};svg.onpointerup=svg.onpointercancel=()=>{drag=false};
    svg.onkeydown=ev=>{if(G.answered)return;const d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[ev.key];if(d){ev.preventDefault();ev.stopPropagation();put(WS.k===null?(d>0?0:20):WS.k+d)}};
  },
  empty:()=>WS.k===null?'Setze zuerst den Pfeil auf den Zahlenstrahl.':'',
  check:q=>WS.k===q.i,
  done(q,ok){WS.svg.querySelector('.mark.live').classList.add(ok?'good':'bad');if(!ok)WS.svg.insertAdjacentHTML('beforeend',arrowAt(q.i,'right'))}
 }
};

/* ---------- Zahlbild-Insel ---------- */
const ZB={
 lesen(){const n=zahl3(),[h,z,e]=hze(n);return num(`<p>Welche Zahl ist in Geheimschrift dargestellt?</p>${geheim(n)}<p class="tip">Quadrat = Hunderter, Strich = Zehner, Punkt = Einer</p>`,n,`${bildText([h,z,e])}: ${h} H ${z} Z ${e} E = ${n}`,'Zahlbild lesen')},
 zeichnen(){const n=zahl3(),[h,z,e]=hze(n);return {kind:'widget',w:'zeichnen',stil:'geheim',label:'Zeichne in Geheimschrift',html:`<p>Zeichne die Zahl <b>${n}</b> in Geheimschrift.</p>`,ans:n,sol:`${n}: ${bildText([h,z,e])}`}},
 plaettchen(){const n=zahl3(),[h,z,e]=hze(n);return num(`<p>Welche Zahl zeigen die Plättchen?</p>${plaettchen(n)}`,n,`${h} H ${z} Z ${e} E = ${n}`,'Plättchen lesen')},
 legen(){const n=zahl3(),[h,z,e]=hze(n);return {kind:'widget',w:'zeichnen',stil:'plaettchen',label:'Lege mit Plättchen',html:`<p>Lege die Zahl <b>${n}</b> mit Plättchen in die Stellenwerttafel.</p>`,ans:n,sol:`${n}: ${h} Plättchen bei H, ${z} bei Z, ${e} bei E`}},
 schieben(){for(;;){const n=zahl3(),d=hze(n),[a,b]=shuffle([0,1,2]).slice(0,2);if(!d[a]||d[b]===9)continue;const m=n-[100,10,1][a]+[100,10,1][b];
   return num(`${plaettchen(n)}<p>Ein Plättchen wird von den <b>${STELLE[HZE[a]]}</b> zu den <b>${STELLE[HZE[b]]}</b> geschoben. Welche Zahl entsteht?</p>`,m,`${n} wird zu ${m}`,'Plättchen verschieben')}},
 mitk(){const k=R(2,5),sum=x=>hze(x).reduce((a,b)=>a+b,0),hits=[],other=[];
  for(let t=0;t<2000&&(hits.length<3||other.length<3);t++){const x=R(1,999);if(sum(x)===k){if(hits.length<3&&!hits.includes(x))hits.push(x)}else if(Math.abs(sum(x)-k)===1&&other.length<3&&!other.includes(x))other.push(x)}
  const ws=shuffle(hits.concat(other).map(String));
  return {kind:'alle',label:'Tippe alle passenden Zahlen an',html:`<p>Welche Zahlen kann man mit genau <b>${k} Plättchen</b> legen?</p><p class="tip">Zähle die Ziffern zusammen: So viele Plättchen braucht man.</p>`,tiles:ws,hits:ws.flatMap((w,i)=>sum(+w)===k?[i]:[]),sol:`Mit ${k} Plättchen: ${hits.join(', ')}`}}
};

/* ---------- Tausenderbuch-Insel (Hundertertafeln: 1 bis 100, 101 bis 200 …) ---------- */
const zeile=n=>Math.floor(((n-1)%100)/10)+1,spalte=n=>(n-1)%10+1;
const TB={
 nachbar(){const [w,d,ok]=pick([['direkt unter',10,n=>zeile(n)<10],['direkt über',-10,n=>zeile(n)>1],['direkt links neben',-1,n=>spalte(n)>1],['direkt rechts neben',1,n=>spalte(n)<10]]);let n;do n=R(1,1000);while(!ok(n));
  return num(`<p>Welche Zahl steht im Tausenderbuch <b>${w} ${n}</b>?</p>`,n+d,`${w[0].toUpperCase()+w.slice(1)} ${n} steht ${n+d}.`,'Tausenderbuch')},
 lage(){const n=R(1,1000),z=Math.random()<.5;
  return num(big(`${n}`)+`<p>In welcher <b>${z?'Zeile':'Spalte'}</b> seiner Hundertertafel steht ${n}?</p><p class="tip">Jede Hundertertafel hat 10 Zeilen und 10 Spalten.</p>`,z?zeile(n):spalte(n),`${n} steht in der ${zeile(n)}. Zeile und ${spalte(n)}. Spalte.`,'Zeilen und Spalten')},

const SUB={bild:ZB,buch:TB,zerlegen:ZL,wort:ZW,strahl:ZS,nachbar:NB,ordnen:OR,koerper:KO};
function gen(isl,sub){ // eine Frage einer Insel; Unterart gewichtet nach Fehlern (wk = "insel.unterart")
  const subs=Object.keys(SUB[isl]);
  if(!sub){const w=subs.map(k=>1+Math.min(3,save.weak[isl+'.'+k]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0);sub=subs.find((k,i)=>(r-=w[i])<0)||subs[0]}
  const q=SUB[isl][sub]();if(!q.label)q.label='Welche Zahl ist es?';
  return Object.assign(q,{isl,sub,wk:isl+'.'+sub});
}
const makeQ=topic=>gen(topic==='mix'?pick(TOPICS).id:topic);
const redoQ=q=>gen(q.isl,q.sub);                                     // nach einem Fehler: neue Aufgabe derselben Art
function makeRound(topic){ // Ich-kann-Check: aus jedem Thema der Checkliste zwei verschiedene Aufgaben
  if(topic!=='check')return null;
  return TOPICS.flatMap(t=>shuffle(Object.keys(SUB[t.id])).slice(0,2).map(s=>gen(t.id,s)));
}
function mcify(q){ // Zahl-Aufgabe in eine Auswahlfrage verwandeln (für die Blitzrunde)
  if(q.kind==='mc')return q;const a=q.ans;
  return Object.assign({},q,{kind:'mc',options:opts4(String(a),[a+1,a-1,a+10,a-10,a+100,a-100].filter(x=>x>=0&&x!==a).map(String)),correct:String(a)});
}
function quickQ(){let q;do q=makeQ('mix');while(q.kind!=='mc'&&q.kind!=='num');return mcify(q)}
function finishExtra(g){ // Ich-kann-Check: Ergebnis je Thema wie auf der Checkliste
  if(g.topic!=='check')return '';
  const face=k=>k===2?['😀','Kann ich']:k===1?['😐','Fast']:['🙁','Üben'];
  return `<table class="cancheck"><tr><th>Ich kann …</th><th></th><th></th></tr>${TOPICS.map(t=>{const r=(g.res||[]).filter(x=>x.isl===t.id),k=r.filter(x=>x.ok).length,[f,w]=face(k);
    return `<tr><td>${esc(t.can)}</td><td class="face" aria-label="${w}">${f}</td><td>${k<2?`<button class="theme" data-go="${t.id}">Üben</button>`:''}</td></tr>`}).join('')}</table>`;
}

}

  <div class="namebox"><label for="nm">Dein Name</label><input type="text" id="nm" maxlength="16" value="${esc(save.name)}" placeholder="z. B. Mia" autocomplete="off"></div>
  ${resume}
  <div class="grid"><button class="tile mix" data-t="check"><h3>Ich-kann-Check</h3><span class="sub">Probe-Arbeit: zwei Aufgaben zu jedem Thema. Am Ende siehst du, was du schon kannst.</span>${starsHtml(save.best.check||0)}</button></div>
  <div class="maphead"><h2 class="sec" style="margin:0">Seekarte</h2><span class="pill">Schätze: ${chests} von ${TOPICS.length}</span></div>
  ${seaMap(MAP,170)}
  <p class="tip" style="margin-top:4px">Drei Sterne auf einer Insel, und du findest ihren Schatz.</p>
  <h2 class="sec">Spiele</h2><div class="grid">
   <button class="tile" data-t="mix"><h3>Große Rundfahrt</h3><span class="sub">Aufgaben von allen Inseln gemischt</span>${starsHtml(save.best.mix||0)}</button>
   <button class="tile" id="gb"><h3>Blitzrunde</h3><span class="sub">${BLITZ} Sekunden: Wie viele schaffst du?</span><span class="sub">Rekord: ${save.blitz||0} richtig</span></button>
   <button class="tile" id="gm"><h3>Memory</h3><span class="sub">Finde ${PAIRS} Paare: Zahlwort und Zahl</span><span class="sub">${save.memo?'Rekord: '+save.memo+' Züge':'Noch kein Rekord'}</span></button>
   <button class="tile" id="gv" data-ico="⚖️"><h3>Größer oder kleiner?</h3><span class="sub">Zahlen bis 1000 vergleichen, immer schneller</span><span class="sub">Rekord: ${save.vergleich||0} richtig</span></button>
  </div>
  <h2 class="sec">Inseln</h2><div class="grid isles">${tiles}</div>
  <p class="tip">${storageOK?'Dein Fortschritt wird automatisch auf diesem Gerät gespeichert.':'Speichern geht in diesem Browser gerade nicht (privates Fenster?). Dein Fortschritt geht beim Schließen verloren.'}</p>
  <p class="tip">Sterne gibt es für richtige Antworten beim ersten Versuch: 5 von 10 = 1 Stern, 7 von 10 = 2 Sterne, 9 von 10 = 3 Sterne.</p>
  <p class="tip"><button class="theme" id="rst">Alles zurücksetzen</button></p>`;
  bindTheme();
  $('#nm').oninput=e=>{save.name=e.target.value.trim();persist()};
  document.querySelectorAll('[data-t]').forEach(b=>{b.onclick=()=>start(b.dataset.t);
    if(b.tagName==='g')b.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();start(b.dataset.t)}}});
  $('#gb').onclick=blitz;$('#gm').onclick=memory;$('#gv').onclick=vergleich;
  if(rg)$('#rs').onclick=()=>{G=Object.assign({answered:false,res:[]},rg);show()};
  let armed=false;$('#rst').onclick=ev=>{if(!armed){armed=true;ev.target.textContent='Wirklich alles löschen? Nochmal tippen.';return}save={name:'',xp:0,best:{},weak:{},round:null,sound:false,blitz:0,memo:0,vergleich:0};persist();home()};
}

home();
</script>

</body>
</html>
