 ['Schlüssel','der','Schlüssel','Ding','🔑'],['Kiste','die','Kisten','Ding','📦'],['Löffel','der','Löffel','Ding','🥄'],['Zug','der','Züge','Ding','🚆'],

const ZUS=[

 ['Apfel','der','Baum','der','Apfelbaum'],['Haus','das','Tür','die','Haustür'],['Spiel','das','Platz','der','Spielplatz'],['Brief','der','Kasten','der','Briefkasten'],
 ['Sonne','die','Blume','die','Sonnenblume'],['Wasser','das','Flasche','die','Wasserflasche'],['Fenster','das','Griff','der','Fenstergriff'],['Tasche','die','Lampe','die','Taschenlampe'],
 ['Zahn','der','Bürste','die','Zahnbürste'],['Hand','die','Schuh','der','Handschuh'],['Auto','das','Tür','die','Autotür'],['Auto','das','Reifen','der','Autoreifen'],
 ['Schnee','der','Mann','der','Schneemann'],['Garten','der','Haus','das','Gartenhaus'],['Blume','die','Topf','der','Blumentopf'],['Müll','der','Tonne','die','Mülltonne'],
 ['Stuhl','der','Bein','das','Stuhlbein'],['Vogel','der','Haus','das','Vogelhaus'],['Pferd','das','Stall','der','Pferdestall'],['Hund','der','Hütte','die','Hundehütte'],
 ['Schlüssel','der','Loch','das','Schlüsselloch'],['Baum','der','Haus','das','Baumhaus'],['Sand','der','Burg','die','Sandburg'],['Brot','das','Dose','die','Brotdose'],
 ['Tisch','der','Bein','das','Tischbein'],['Post','die','Karte','die','Postkarte']
];

 ['Die Sonne scheint','A',0],['Oma backt einen Kuchen','A',1],['Tim liest ein Buch','A',1],['Die Katze schläft auf dem Sofa','A',0],['Papa repariert das Fahrrad','A',1],
 ['Im Garten blühen Blumen','A',0],['Mia hat heute Geburtstag','A',1],['Es regnet seit dem Morgen','A',0],['Ich trinke einen Kakao','A',0],['Die Kinder lachen','A',0],
 ['Wo ist mein Schuh','F',0],['Kommst du mit','F',0],['Was gibt es heute zu essen','F',0],['Wann beginnt die Pause','F',0],['Hast du Hunger','F',0],
 ['Wer hat den Ball','F',0],['Spielst du mit mir','F',0],['Wie heißt dein Hund','F',0],['Darf ich mitkommen','F',0],['Warum lachst du','F',0]
];
const NAMEN_NOMEN=['Lara','Mama','Ben','Oma','Tim','Papa','Mia','Garten','Ball','Schuh','Sonne','Katze','Hund','Kinder','Kuchen','Buch','Bild','Suppe','Zoo','Sofa','Fahrrad','Blumen','Geburtstag','Morgen','Kakao','Pause','Hunger'];
// Laute einsetzen: Selbstlaute [Emoji, Wort, Stelle der Lücke]; bei Umlauten und Zwielauten sucht die Seite die Stelle selbst
const SELBST=[['🐕','Hund',1],['🐇','Hase',1],['👖','Hose',1],['⚽','Ball',1],['🐟','Fisch',1],['✏️','Stift',2],['🍴','Gabel',1],['🖌️','Pinsel',1],['🥫','Dose',1],['🌹','Rose',1],['👃','Nase',1],['🎩','Hut',1],['🐄','Kuh',1],['🚌','Bus',1],['🦆','Ente',0],['🍎','Apfel',0],['🦔','Igel',0]];
const UMLAUT=[['🐻','Bär'],['🧀','Käse'],['🥕','Möhre'],['👑','König'],['🚪','Tür'],['🔑','Schlüssel'],['🧢','Mütze'],['🐞','Käfer'],['🦁','Löwe'],['🥄','Löffel'],['🎲','Würfel'],['🥦','Gemüse']];
const ZWIE=[['🪣','Eimer'],['🐭','Maus'],['🌽','Mais'],['🪜','Leiter'],['🏠','Haus'],['🦉','Eule'],['🔥','Feuer'],['👗','Kleid'],['🌳','Baum'],['🚗','Auto'],['🧼','Seife'],['🦈','Hai'],['👍','Daumen'],['🍂','Laub'],['🏘️','Häuser']];
const ZWIELAUTE=['ai','au','äu','ei','eu'];

const SILBEN=['Hund','Ka-tze','Ba-na-ne','Schu-le','Te-le-fon','Scho-ko-la-de','Kro-ko-dil','Ap-fel','E-le-fant','Gi-raf-fe','Fahr-rad','Re-gen-schirm','Ge-burts-tag','Ku-gel-schrei-ber','Was-ser','Blu-me','Fuß-ball','Spiel-platz','Son-ne','Ta-schen-lam-pe','Pau-se','Hams-ter','Ma-ri-en-kä-fer','Schmet-ter-ling','Ei','Brot'];

const IE=[['Biene','🐝','ie'],['Brief','✉️','ie'],['Ziege','🐐','ie'],['Wiese','','ie'],['Spiegel','🪞','ie'],['Tier','','ie'],['Riese','','ie'],['Papier','📄','ie'],
 ['Stiefel','👢','ie'],['Knie','','ie'],['Ziel','🏁','ie'],['Fliege','🪰','ie'],['Dieb','','ie'],['lieb','','ie'],['viel','','ie'],['schief','','ie'],['fliegen','','ie'],['spielen','','ie'],
 ['Kind','🧒','i'],['Fisch','🐟','i'],['Tisch','','i'],['Kiste','📦','i'],['Ring','💍','i'],['Wind','🌬️','i'],['Bild','🖼️','i'],['Milch','🥛','i'],['Licht','💡','i'],
 ['Zimmer','','i'],['Himmel','','i'],['Kirsche','🍒','i'],['Zitrone','🍋','i'],['Brille','👓','i'],['Schiff','🚢','i'],['bitte','','i'],['mit','','i'],['nicht','','i'],
 ['Tiger','🐯','merk'],['Igel','🦔','merk'],['Krokodil','🐊','merk'],['Kino','🎬','merk'],['wir','','merk'],['mir','','merk'],['dir','','merk']];

/* ---------- Hilfen ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const cap=t=>t[0].toUpperCase()+t.slice(1);
const UP=t=>t.toUpperCase().replace(/ß/g,'SS');
const mc=o=>Object.assign({kind:'mc'},o);
const GAP='<span class="gap">?</span>';
const emo=e=>e?`<span class="emo" aria-hidden="true">${e}</span>`:'';
const ein=a=>a==='die'?'eine':'ein';
const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const VOKALE='aeiou';

/* ---------- Nomen-Insel ---------- */
const NO={
 erkennen(){const n=pick(NOMEN),o=shuffle([UP(n[0])].concat(shuffle(KEIN_NOMEN).slice(0,3).map(UP)));
  return mc({label:'Welches Wort ist ein Nomen?',html:'<p>Nomen sind Wörter für Menschen, Tiere, Pflanzen und Dinge.</p>',options:o,correct:UP(n[0]),sol:`${n[1]} ${n[0]} ist ein Nomen.`,say:`${n[1]} ${n[0]}`})},
 artikel(){const n=pick(NOMEN);return mc({label:'Welcher Artikel passt?',html:`<p class="big">${emo(n[4])}${GAP} ${n[0]}</p>`,options:['der','die','das'],correct:n[1],sol:`${n[1]} ${n[0]}`,say:`${n[1]} ${n[0]}`})},
 unbestimmt(){const n=pick(NOMEN);return mc({label:'Welcher unbestimmte Artikel passt?',html:`<p class="big">${emo(n[4])}${GAP} ${n[0]}</p>`,options:['ein','eine'],correct:ein(n[1]),sol:`${ein(n[1])} ${n[0]} (${n[1]} ${n[0]})`,say:`${ein(n[1])} ${n[0]}`})},
 welcherArt(){const a=pick(['der','die','das','ein','eine']),b=['der','die','das'].includes(a);
  return mc({label:'Bestimmt oder unbestimmt?',html:`<p>Ist <b>${a}</b> ein bestimmter oder ein unbestimmter Artikel?</p>`,options:['bestimmter Artikel','unbestimmter Artikel'],correct:b?'bestimmter Artikel':'unbestimmter Artikel',sol:'der, die, das sind bestimmte Artikel. ein, eine sind unbestimmte Artikel.'})},
 mehrzahl(){const n=pick(NOMEN.filter(n=>n[2]!==n[0])),pl=n[2].split('|');return {kind:'type',label:'Schreibe die Mehrzahl',html:`<p class="big">${emo(n[4])}${n[1]} ${n[0]} → die ${GAP}</p>`,accept:pl,correct:pl[0],sol:`${n[1]} ${n[0]} – die ${pl[0]}`,say:`die ${pl[0]}`}},
 einzahl(){const n=pick(NOMEN.filter(n=>n[2]!==n[0])),pl=n[2].split('|')[0]; // andere Antworten: Einzahl-Wörter, die nicht auch Mehrzahl sein können
  return mc({label:'Einzahl oder Mehrzahl?',html:`<p>Welches Wort steht in der <b>Mehrzahl</b>?</p>`,options:shuffle([pl].concat(shuffle(NOMEN.filter(x=>x!==n&&x[2]!==x[0])).slice(0,3).map(x=>x[0]))),correct:pl,sol:`die ${pl} ist Mehrzahl, die Einzahl heißt ${n[1]} ${n[0]}.`})},
 gruppe(){const n=pick(NOMEN);return mc({label:'Wozu gehört das Nomen?',html:`<p class="big">${emo(n[4])}${n[1]} ${n[0]}</p>`,options:['Mensch','Tier','Pflanze','Ding'],correct:n[3],sol:`${n[1]} ${n[0]}: ${n[3]}`,say:`${n[1]} ${n[0]}`})}
};
function uniqStr(a){return [...new Set(a)]}

/* ---------- Wörter-bau-Insel (zusammengesetzte Nomen) ---------- */
const ZU={
 bilden(){const z=pick(ZUS),near=ZUS.filter(x=>x!==z&&(x[0]===z[0]||x[2]===z[2])),o=uniqStr(shuffle(near).concat(shuffle(ZUS.filter(x=>x!==z))).map(x=>x[4])).filter(w=>w!==z[4]).slice(0,3);
  return mc({label:'Welches Wort entsteht?',html:`<p class="big">${z[1]} ${z[0]} + ${z[3]} ${z[2]} = ?</p>`,options:shuffle([z[4]].concat(o)),correct:z[4],sol:`${z[1]} ${z[0]} + ${z[3]} ${z[2]} = ${z[3]} ${z[4]}`,say:`${z[3]} ${z[4]}`})},
 schreiben(){const z=pick(ZUS.filter(z=>z[4]===z[0]+z[2].toLowerCase()));
  return {kind:'type',label:'Schreibe das zusammengesetzte Nomen',html:`<p class="big">${z[1]} ${z[0]} + ${z[3]} ${z[2]} = ${z[3]} ${GAP}</p>`,accept:[z[4]],correct:z[4],sol:`${z[3]} ${z[4]}`,say:`${z[3]} ${z[4]}`}},
 artikel(){const z=pick(ZUS);
  return mc({label:'Welcher Artikel passt?',html:`<p class="big">${GAP} ${z[4]}</p><p class="tip">Tipp: Der Artikel richtet sich nach dem letzten Wort.</p>`,options:['der','die','das'],correct:z[3],sol:`${z[3]} ${z[4]}, denn es heißt ${z[3]} ${z[2]}.`,say:`${z[3]} ${z[4]}`})},
 zerlegen(){const z=pick(ZUS),first=Math.random()<.5,ans=first?z[0]:z[2];
  const pool=uniqStr(ZUS.flatMap(x=>[x[0],x[2]])).filter(w=>w!==z[0]&&w!==z[2]);
  return mc({label:'Welche Nomen stecken darin?',html:`<p class="big">${z[3]} ${z[4]} = ${first?`${GAP} + ${z[3]} ${z[2]}`:`${z[1]} ${z[0]} + ${GAP}`}</p>`,options:shuffle([ans].concat(shuffle(pool).slice(0,3))),correct:ans,sol:`${z[3]} ${z[4]} = ${z[1]} ${z[0]} + ${z[3]} ${z[2]}`})},
 finden(){const z=pick(ZUS),simple=shuffle(NOMEN.filter(n=>!ZUS.some(x=>x[4]===n[0])&&n[0].length<=6)).slice(0,3).map(n=>n[0]);
  return mc({label:'Welches Nomen ist zusammengesetzt?',html:'<p>Ein zusammengesetztes Nomen besteht aus zwei Nomen.</p>',options:shuffle([z[4]].concat(simple)),correct:z[4],sol:`${z[4]} = ${z[0]} + ${z[2]}`})}
};

/* ---------- Satzzeichen-Insel ---------- */
const startKlein=s=>s[2]?s[0]:s[0][0].toLowerCase()+s[0].slice(1); // Satzanfang klein, außer bei Nomen und Namen
const mark=s=>s[1]==='F'?'?':'.';
function twoSentences(){let a,b;do{a=pick(SAETZE);b=pick(SAETZE)}while(a===b);return [a,b]}
const SZ={
 zeichen(){const s=pick(SAETZE);return mc({label:'Welches Satzzeichen fehlt?',html:`<p class="big">${s[0]} ${GAP}</p>`,options:['.','?'],correct:mark(s),sol:`${s[0]}${mark(s)} ${s[1]==='F'?'Das ist eine Frage.':'Das ist ein Aussagesatz.'}`,say:s[0]+mark(s)})},
 satzart(){const s=pick(SAETZE);return mc({label:'Was für ein Satz ist das?',html:`<p class="big">${s[0]}${mark(s)}</p>`,options:['Aussagesatz','Fragesatz'],correct:s[1]==='F'?'Fragesatz':'Aussagesatz',sol:s[1]==='F'?'Fragesatz: Am Ende steht ein Fragezeichen.':'Aussagesatz: Am Ende steht ein Punkt.',say:s[0]+mark(s)})},
 gross(){let a,b;do{[a,b]=twoSentences()}while(b[2]);const w0=b[0].split(' ')[0],low=startKlein(b),wrong=low.split(' ').slice(1).filter(w=>!NAMEN_NOMEN.includes(w)&&w===w.toLowerCase());
  const o=shuffle([w0.toLowerCase()].concat(shuffle(uniqStr(wrong.concat(a[0].split(' ').slice(1).filter(w=>w===w.toLowerCase())))).filter(w=>w!==w0.toLowerCase()).slice(0,3)));
  return mc({label:'Welches Wort muss großgeschrieben werden?',html:`<p class="big">${a[0]}${mark(a)} ${low}${mark(b)}</p>`,options:o,correct:w0.toLowerCase(),sol:`${w0} – am Satzanfang schreibt man groß.`,say:`${a[0]}${mark(a)} ${b[0]}${mark(b)}`})},
 grenzen(){const [a,b]=twoSentences(),ok=`${a[0]}${mark(a)} ${b[0]}${mark(b)}`,aw=a[0].split(' ');
  const w=[];
  w.push(`${aw.slice(0,-1).join(' ')}${mark(a)} ${cap(aw[aw.length-1])} ${startKlein(b)}${mark(b)}`); // Grenze an falscher Stelle
  w.push(`${a[0]} ${startKlein(b)}${mark(b)}`);                                                   // Satzzeichen fehlt
  if(a[1]==='F')w.push(`${a[0]}. ${b[0]}${mark(b)}`);                                            // Punkt nach einer Frage
  if(!b[2])w.push(`${a[0]}${mark(a)} ${startKlein(b)}${mark(b)}`);                                 // klein nach dem Punkt
  return mc({label:'Welcher Text ist richtig geschrieben?',html:'<p>Achte auf Satzzeichen und große Satzanfänge.</p>',options:shuffle([ok].concat(shuffle(uniqStr(w).filter(x=>x!==ok)).slice(0,2))),correct:ok,sol:ok,say:ok})}
};

/* ---------- ABC-Insel ---------- */
const ABCW=['Ampel','Banane','Clown','Dach','Eule','Fuchs','Gabel','Hund','Insel','Junge','Kerze','Lampe','Mond','Nest','Obst','Pilz','Quark','Rabe','Sonne','Tasse','Uhr','Vase','Wolke','Zebra','Hose','Hand','Haus','Hemd','Hut','Hase','Berg','Ball','Bus','Brot','Biene','Buch'];
const AB={
 luecke(){const i=R(1,24),k=Math.random()<.6?i:pick([i-1,i+1]),show=[ABC[i-1],ABC[i],ABC[i+1]].map((c,j)=>j===k-i+1?GAP:c);
  const L=ABC[k];return {kind:'type',label:'Welcher Buchstabe fehlt?',html:`<p class="big">${show.join(' ')}</p>`,accept:[L,L.toLowerCase()],correct:L,sol:`${ABC[i-1]} ${ABC[i]} ${ABC[i+1]}`}},
 nachbar(){const i=R(1,24),nach=Math.random()<.5,L=nach?ABC[i+1]:ABC[i-1];
  return mc({label:'Abc',html:`<p class="big">Welcher Buchstabe kommt ${nach?'nach':'vor'} <b>${ABC[i]}</b>?</p>`,options:shuffle(uniqStr([L,ABC[nach?i-1:i+1],ABC[nach?Math.min(25,i+2):Math.max(0,i-2)],ABC[(i+5)%26]]).filter(x=>x!==ABC[i])),correct:L,sol:nach?`${ABC[i]} ${L}`:`${L} ${ABC[i]}`})},
 ordnen(){const same=Math.random()<.4;let ws;
  // gleicher Anfang: Gruppen mit verschiedenen zweiten Buchstaben
  if(same)ws=shuffle(pick([['Hand','Hemd','Hose','Hund'],['Ball','Berg','Biene','Brot','Bus']])).slice(0,4);else{ws=[];for(const w of shuffle(ABCW))if(!ws.some(x=>x[0]===w[0])){ws.push(w);if(ws.length===5)break}}
  const s=ws.slice().sort((a,b)=>a.toLowerCase()<b.toLowerCase()?-1:1);
  return {kind:'build',label:'Ordne nach dem Abc',html:`<p>Tippe die Wörter in der Reihenfolge des Abc an.${same?' Alle beginnen gleich – schau auf den zweiten Buchstaben!':''}</p>`,tiles:shuffle(ws),target:s.join(' '),sol:s.join(', ')}},
 erstes(){const ws=[];for(const w of shuffle(ABCW))if(!ws.some(x=>x[0]===w[0])){ws.push(w);if(ws.length===4)break}const f=ws.slice().sort((a,b)=>a<b?-1:1)[0];
  return mc({label:'Welches Wort steht im Abc zuerst?',html:'<p>Schau auf den ersten Buchstaben.</p>',options:shuffle(ws.slice()),correct:f,sol:`${f} steht zuerst.`})},
 raetsel(){const w=pick(['HUND','HAUS','BALL','OMA','OPA','MAUS','BAUM','NEST','HUT','BUS','ROSE','KUH','EULE','SONNE','MOND']),nums=[...w].map(c=>ABC.indexOf(c)+1);
  return {kind:'type',label:'Abc-Rätsel: Welches Wort ist es?',html:`<p class="tip">A = 1, B = 2, C = 3 … Z = 26</p><p class="abcrow">${[...ABC].map((c,i)=>`<span><b>${c}</b>${i+1}</span>`).join('')}</p><p class="big">${nums.join(' – ')}</p>`,
    accept:[w,cap(w.toLowerCase())],correct:w,sol:`${nums.join(' – ')} = ${w}`}},
 anzahl(){return mc({label:'Abc',html:'<p class="big">Wie viele Buchstaben hat das Abc?</p>',options:['24','26','28','30'],correct:'26',sol:'Das Abc hat 26 Buchstaben.'})}
};

/* ---------- Laute-Insel ---------- */
function lueckeWort(w,i,n){return `${w.slice(0,i)}${GAP}${w.slice(i+n)}`}
const LA={
 selbst(){const [e,w,i]=pick(SELBST),v=w[i],o=(i===0?['A','E','I','O','U']:['a','e','i','o','u']);
  return mc({label:'Welcher Selbstlaut fehlt?',html:`<p class="big">${emo(e)}${lueckeWort(w,i,1)}</p>`,options:o,correct:v,sol:w,say:w})},
 umlaut(){const [e,w]=pick(UMLAUT),i=w.search(/[äöü]/i);return mc({label:'Setze den Umlaut ein: ä, ö oder ü?',html:`<p class="big">${emo(e)}${lueckeWort(w,i,1)}</p>`,options:['ä','ö','ü'],correct:w[i],sol:w,say:w})},
 zwie(){const [e,w]=pick(ZWIE),i=w.search(/ai|au|äu|ei|eu/i),z=w.slice(i,i+2),o=ZWIELAUTE.map(x=>i===0?cap(x):x);
  return mc({label:'Setze den Zwielaut ein',html:`<p class="big">${emo(e)}${lueckeWort(w,i,2)}</p>`,options:o,correct:i===0?cap(z.toLowerCase()):z,sol:w,say:w})},
 gruppe(){const t=pick([['a','Selbstlaut'],['e','Selbstlaut'],['i','Selbstlaut'],['o','Selbstlaut'],['u','Selbstlaut'],['ä','Umlaut'],['ö','Umlaut'],['ü','Umlaut'],
   ['ai','Zwielaut'],['au','Zwielaut'],['äu','Zwielaut'],['ei','Zwielaut'],['eu','Zwielaut'],['m','Mitlaut'],['t','Mitlaut'],['k','Mitlaut'],['s','Mitlaut'],['r','Mitlaut']]);
  return mc({label:'Was ist das für ein Laut?',html:`<p class="big">${t[0]}</p>`,options:['Selbstlaut','Umlaut','Zwielaut','Mitlaut'],correct:t[1],sol:`${t[0]} ist ein ${t[1]}.`})},
 welcher(){const v=pick([...VOKALE]),c=shuffle([...'bcdfghklmnprstwz']).slice(0,3);
  return mc({label:'Welcher Buchstabe ist ein Selbstlaut?',html:'<p>Selbstlaute sind a, e, i, o, u.</p>',options:shuffle([v].concat(c)),correct:v,sol:`${v} ist ein Selbstlaut.`})},
 silben(){const w=pick(SILBEN),n=w.split('-').length,word=w.replace(/-/g,'');
  return {kind:'num',label:'Wie viele Silben hat das Wort?',html:`<p class="big">${word}</p><p class="tip">Tipp: Jede Silbe hat einen Selbstlaut (oder Umlaut, Zwielaut). Klatsche mit!</p>`,ans:n,sol:`${w}: ${n} ${n===1?'Silbe':'Silben'}`,say:word}}
};

/* ---------- ie-oder-i-Insel ---------- */
const lueckeIE=w=>{const i=w.search(/ie|i/i),n=w.slice(i,i+2).toLowerCase()==='ie'?2:1;return {i,n,shown:w.slice(0,i)+GAP+w.slice(i+n)}};
const IEW=IE.filter(x=>x[2]!=='merk');
const IE_={
 einsetzen(){const x=pick(IEW),{shown}=lueckeIE(x[0]),up=/^[IJ]/.test(x[0]);
  return mc({label:'ie oder i?',html:`<p class="big">${emo(x[1])}${shown}</p>`,options:up?['I','Ie']:['i','ie'],correct:x[2]==='ie'?(up?'Ie':'ie'):(up?'I':'i'),sol:`${x[0]} – ${x[2]==='ie'?'das i ist lang: ie':'das i ist kurz: i'}`,say:x[0]})},
 lang(){const x=pick(IE);return mc({label:'Wird das i lang oder kurz gesprochen?',html:`<p class="big">${emo(x[1])}${x[0]}</p>`,options:['lang','kurz'],correct:x[2]==='i'?'kurz':'lang',sol:x[2]==='merk'?`${x[0]}: lang – aber ohne e! Das ist ein Merkwort.`:`${x[0]}: ${x[2]==='ie'?'lang, deshalb ie':'kurz, deshalb nur i'}`,say:x[0]})},
 hoeren(){const x=pick(IE);return {kind:'listen',label:'Hör genau hin: Ist das i lang oder kurz?',options:['lang','kurz'],correct:x[2]==='i'?'kurz':'lang',sol:`${x[0]}: ${x[2]==='i'?'kurz':'lang'}${x[2]==='merk'?' (Merkwort ohne e)':''}`,say:x[0]}},
 schreiben(){ // nur Bilder mit eindeutigem Namen (📄 könnte auch „Blatt“ heißen)
  const x=pick(IE.filter(x=>['Biene','Spiegel','Stiefel','Fliege','Fisch','Ring','Milch','Kirsche','Zitrone','Brille','Schiff'].includes(x[0])));return {kind:'type',label:'Schreibe das Wort richtig',html:`<p class="big">${emo(x[1])}</p><p class="tip">Nomen schreibt man groß. Denk an ie oder i!</p>`,accept:[x[0]],correct:x[0],sol:x[0],say:x[0]}},
 merk(){const m=pick(IE.filter(x=>x[2]==='merk')),o=shuffle(IEW).slice(0,3).map(x=>x[0]);
  return mc({label:'Welches Wort ist ein Merkwort?',html:'<p>Bei Merkwörtern hört man ein langes i, schreibt aber kein e.</p>',options:shuffle([m[0]].concat(o)),correct:m[0],sol:`${m[0]} ist ein Merkwort: langes i ohne e.`,say:m[0]})}
};

/* ---------- Auswahl der Fragen ---------- */
const AUFG={nomen:NO,zusammen:ZU,satz:SZ,abc:AB,laute:LA,ie:IE_};
function gen(isl,sub){ // Unterart gewichtet nach Fehlern; Hör-Aufgaben nur, wenn eine deutsche Stimme da ist
  const subs=Object.keys(AUFG[isl]).filter(k=>k!=='hoeren'||canSpeak());
  if(!sub){const w=subs.map(k=>1+Math.min(3,save.weak[isl+'.'+k]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0);sub=subs.find((k,i)=>(r-=w[i])<0)||subs[0]}
  return Object.assign(AUFG[isl][sub](),{isl,sub,wk:isl+'.'+sub});
}
const makeQ=topic=>gen(topic==='mix'?pick(TOPICS).id:topic);
const redoQ=q=>gen(q.isl,q.sub);
function makeRound(topic){ // Ich-kann-Check: aus jedem Thema zwei verschiedene Aufgaben
  if(topic!=='check')return null;
  return TOPICS.flatMap(t=>shuffle(Object.keys(AUFG[t.id]).filter(k=>k!=='hoeren'||canSpeak())).slice(0,2).map(s=>gen(t.id,s)));
}
function quickQ(){let q;do q=makeQ('mix');while(q.kind!=='mc');return q}
function finishExtra(g){
  if(g.topic!=='check')return '';
  const face=k=>k===2?['😀','Kann ich']:k===1?['😐','Fast']:['🙁','Üben'];
  return `<table class="cancheck"><tr><th>Ich kann …</th><th></th><th></th></tr>${TOPICS.map(t=>{const r=(g.res||[]).filter(x=>x.isl===t.id),k=r.filter(x=>x.ok).length,[f,w]=face(k);
    return `<tr><td>${esc(t.can)}</td><td class="face" aria-label="${w}">${f}</td><td>${k<2?`<button class="theme" data-go="${t.id}">Üben</button>`:''}</td></tr>`}).join('')}</table>`;
}
function memory(){ // Paare: Einzahl und Mehrzahl, Wörter bauen, Bild und Wort
  const c=[],used=new Set(),add=(a,b)=>{if(used.has(a)||used.has(b))return false;c.push({a,b});used.add(a);used.add(b);return true};
  const pools=[()=>{const n=pick(NOMEN.filter(n=>n[2]!==n[0]));return [`${n[1]} ${n[0]}`,`die ${n[2].split('|')[0]}`]},()=>{const z=pick(ZUS);return [`${z[0]} + ${z[2]}`,z[4]]},
    ()=>{const n=pick(NOMEN.filter(n=>n[4]));return [n[4],`${n[1]} ${n[0]}`]}];
  for(let t=0;t<200&&c.length<PAIRS;t++)add(...pick(pools)());
  memoryGame(shuffle(c),memory,'Finde die Paare: Einzahl und Mehrzahl, Wortteile und Wort, Bild und Wort.');
}

/* ---------- Speicher (nur Komfort, darf ausfallen) ---------- */
let save={name:'',xp:0,best:{},weak:{},sound:true,blitz:0,memo:0};
try{const s=localStorage.getItem('de3-v1');if(s)save=Object.assign(save,JSON.parse(s))}catch(e){}
initRank();
let storageOK=true;
function persist(){try{localStorage.setItem('de3-v1',JSON.stringify(save));storageOK=true}catch(e){storageOK=false}}
try{localStorage.setItem('de3-test','1');localStorage.removeItem('de3-test')}catch(e){storageOK=false}

/* ---------- Startseite ---------- */
const NAMES={check:'Ich-kann-Check',mix:'Große Rundfahrt'};
function home(){
  G=null;M=null;if(B){clearTimeout(B.timer);B=null}
  const hi=save.name?`Ahoi ${esc(save.name)}!`:'Ahoi!';
  const tiles=TOPICS.map(t=>`<button class="tile" data-t="${t.id}"><h3>${t.name}</h3><span class="sub">${t.sub}</span>${starsHtml(save.best[t.id]||0)}</button>`).join('');
  const chests=TOPICS.filter(t=>(save.best[t.id]||0)>=3).length;
  const rg=save.round&&save.round.queue&&save.round.queue.length?save.round:null;
  const resume=rg?`<div class="grid" style="margin-bottom:12px"><button class="tile resume" id="rs"><h3>Weiterspielen</h3><span class="sub">${esc(NAMES[rg.topic]||(TOPICS.find(t=>t.id===rg.topic)||{}).name)}, Frage ${Math.min(rg.done+1,rg.total)} von ${rg.total}</span></button></div>`:'';
  $('#app').innerHTML=`
  <div class="top"><a class="back" href="../../" style="text-decoration:none">Übersicht</a><span class="brand">${BRAND}</span>${themeBtn()}</div>
  <section class="hero"><h1>${hi} Fit für die Deutsch-Arbeit?</h1>
   <p>Nomen, Artikel, Satzzeichen, Abc, Laute und ie oder i. Jede Insel ist ein Thema, eine Fahrt hat ${ROUND} Aufgaben.</p>
   <div class="rank"><span class="pill sun">${save.xp} Punkte</span><span class="pill">Rang: ${rank()}</span></div>${rankBar()}${hero}</section>
  <div class="namebox"><label for="nm">Dein Name</label><input type="text" id="nm" maxlength="16" value="${esc(save.name)}" placeholder="z. B. Mia" autocomplete="off"></div>
  ${resume}
  <div class="grid"><button class="tile mix" data-t="check"><h3>Ich-kann-Check</h3><span class="sub">Probe-Arbeit: zwei Aufgaben zu jedem Thema. Am Ende siehst du, was du schon kannst.</span>${starsHtml(save.best.check||0)}</button></div>
  <div class="maphead"><h2 class="sec" style="margin:0">Seekarte</h2><span class="pill">Schätze: ${chests} von ${TOPICS.length}</span></div>
  ${seaMap(MAP,170)}
  <p class="tip" style="margin-top:4px">Drei Sterne auf einer Insel, und du findest ihren Schatz.</p>
  <h2 class="sec">Spiele</h2><div class="grid">
   <button class="tile" data-t="mix"><h3>Große Rundfahrt</h3><span class="sub">Aufgaben von allen Inseln gemischt</span>${starsHtml(save.best.mix||0)}</button>
   <button class="tile" id="gb"><h3>Blitzrunde</h3><span class="sub">${BLITZ} Sekunden: Wie viele schaffst du?</span><span class="sub">Rekord: ${save.blitz||0} richtig</span></button>
   <button class="tile" id="gm"><h3>Memory</h3><span class="sub">Finde ${PAIRS} Paare</span><span class="sub">${save.memo?'Rekord: '+save.memo+' Züge':'Noch kein Rekord'}</span></button>
  </div>
  <h2 class="sec">Inseln</h2><div class="grid">${tiles}</div>
  <p class="tip">${storageOK?'Dein Fortschritt wird automatisch auf diesem Gerät gespeichert.':'Speichern geht in diesem Browser gerade nicht (privates Fenster?). Dein Fortschritt geht beim Schließen verloren.'}</p>
  <p class="tip">Sterne gibt es für richtige Antworten beim ersten Versuch: 5 von 10 = 1 Stern, 7 von 10 = 2 Sterne, 9 von 10 = 3 Sterne.</p>
  <p class="tip">${VOICE?`<button class="theme" id="snd">${save.sound?'🔊 Ton an':'🔇 Ton aus'}</button> Wörter vorlesen und Hör-Aufgaben nutzen die Stimme dieses Geräts.${/Firefox/.test(navigator.userAgent)&&/Macintosh/.test(navigator.userAgent)?' In Firefox auf dem Mac knackt die Stimme am Ende, in Safari oder Chrome klingt sie sauber.':''}${/iPhone/.test(navigator.userAgent)?' Kein Ton auf dem iPhone? Stummschalter ausschalten (Klingeln an) und lauter stellen.':''}`:'Auf diesem Gerät ist keine deutsche Stimme eingebaut, deshalb gibt es hier keine Hör-Aufgaben.'}</p>
  <p class="tip"><button class="theme" id="rst">Alles zurücksetzen</button></p>`;
  if(VOICE)$('#snd').onclick=()=>{save.sound=!save.sound;persist();say('Hallo! Los geht’s!');home()};
  bindTheme();
  $('#nm').oninput=e=>{save.name=e.target.value.trim();persist()};
  document.querySelectorAll('[data-t]').forEach(b=>{b.onclick=()=>start(b.dataset.t);
    if(b.tagName==='g')b.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();start(b.dataset.t)}}});
  $('#gb').onclick=blitz;$('#gm').onclick=memory;
  if(rg)$('#rs').onclick=()=>{G=Object.assign({answered:false,res:[]},rg);show()};
  let armed=false;$('#rst').onclick=ev=>{if(!armed){armed=true;ev.target.textContent='Wirklich alles löschen? Nochmal tippen.';return}save={name:'',xp:0,best:{},weak:{},round:null,sound:save.sound,blitz:0,memo:0};persist();home()};
}
home();
</script>

</body>
